<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#F6F2EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<title>JLPT N1 — Washi Editorial Study Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #F6F2EA;
    --surface: #FFFDF9;
    --surface-2: #EFE9DD;
    --surface-hover: #EAE2D3;
    --ink: #1C1917;
    --ink-2: #44403C;
    --muted: #6B655D;
    --vermilion: #B83822;
    --vermilion-hover: #9A2C19;
    --vermilion-soft: rgba(184, 56, 34, 0.09);
    --vermilion-border: rgba(184, 56, 34, 0.28);
    --indigo: #1E3A5F;
    --indigo-soft: rgba(30, 58, 95, 0.07);
    --matcha: #2D6A4F;
    --matcha-soft: rgba(45, 106, 79, 0.11);
    --gold: #B45309;
    --gold-soft: rgba(180, 83, 9, 0.11);
    --gold-border: rgba(180, 83, 9, 0.35);
    --border: #E5DEC9;
    --border-strong: #D6CCBA;
    --topbar-h: 54px;
    --sidebar-w: 288px;
    --font-serif: "Shippori Mincho", "Yu Mincho", Georgia, serif;
    --font-sans: "Be Vietnam Pro", "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  [data-theme="dark"] {
    --bg: #141210;
    --surface: #1C1916;
    --surface-2: #25211D;
    --surface-hover: #2E2924;
    --ink: #F3EFE6;
    --ink-2: #D6CFC3;
    --muted: #9C9488;
    --vermilion: #E05A43;
    --vermilion-hover: #EB6E58;
    --vermilion-soft: rgba(224, 90, 67, 0.16);
    --vermilion-border: rgba(224, 90, 67, 0.4);
    --indigo: #7BA3D1;
    --indigo-soft: rgba(123, 163, 209, 0.12);
    --matcha: #52B788;
    --matcha-soft: rgba(82, 183, 136, 0.15);
    --gold: #F59E0B;
    --gold-soft: rgba(245, 158, 11, 0.16);
    --gold-border: rgba(245, 158, 11, 0.4);
    --border: #2E2924;
    --border-strong: #3F3831;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.68;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }

  .ico {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    flex-shrink: 0;
  }
  .ico-fill { fill: currentColor; }

  /* ==================== EDITORIAL HEADER (54px) ==================== */
  .topbar {
    height: var(--topbar-h);
    min-height: var(--topbar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    z-index: 60;
  }
  .top-left, .top-center, .top-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    text-decoration: none;
    color: var(--ink);
    white-space: nowrap;
  }
  /* Traditional Japanese Hanko Seal */
  .hanko {
    width: 28px;
    height: 28px;
    border: 2px solid var(--vermilion);
    border-radius: 5px;
    color: var(--vermilion);
    font-family: var(--font-serif);
    font-weight: 800;
    font-size: 12.5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    letter-spacing: -0.5px;
    background: var(--vermilion-soft);
  }
  .brand-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.2px;
  }
  .mobile-menu-btn { display: none; }

  .nav-tabs {
    display: flex;
    align-items: center;
    gap: 2px;
    border-bottom: none;
  }
  .tab-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    position: relative;
    transition: color 0.16s, background 0.16s;
  }
  .tab-btn:hover { color: var(--ink); background: var(--surface-2); }
  .tab-btn.active {
    color: var(--vermilion);
    background: var(--vermilion-soft);
  }
  .tab-btn.active::after {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: -9px;
    height: 2px;
    background: var(--vermilion);
  }

  .btn {
    cursor: pointer;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    padding: 6px 11px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--muted); }
  .btn:focus-visible, .tab-btn:focus-visible, .nav-item:focus-visible, .exam-opt-btn:focus-visible {
    outline: 2px solid var(--vermilion);
    outline-offset: 2px;
  }
  .btn:disabled { opacity: 0.42; cursor: not-allowed; }
  .btn-icon { padding: 6px 8px; }
  .btn-primary {
    background: var(--vermilion);
    border-color: var(--vermilion);
    color: #FFFDF9;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--vermilion-hover);
    border-color: var(--vermilion-hover);
  }
  .btn-indigo {
    background: var(--indigo);
    border-color: var(--indigo);
    color: #FFFDF9;
  }
  .btn-gold-soft {
    background: var(--gold-soft);
    border-color: var(--gold-border);
    color: var(--gold);
  }
  .btn-active-matcha {
    background: var(--matcha);
    border-color: var(--matcha);
    color: #FFFDF9;
  }
  .btn-active-gold {
    background: var(--gold);
    border-color: var(--gold);
    color: #FFFDF9;
  }

  .sync-pill {
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 99px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    font-family: inherit;
  }
  .sync-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
  }
  .sync-pill.ok { color: var(--matcha); border-color: rgba(45,106,79,0.28); background: var(--matcha-soft); }
  .sync-pill.ok .sync-dot { background: var(--matcha); }
  .sync-pill.syncing { color: var(--indigo); background: var(--indigo-soft); }
  .sync-pill.syncing .sync-dot { background: var(--indigo); }
  .sync-pill.warn { color: var(--gold); background: var(--gold-soft); }
  .sync-pill.warn .sync-dot { background: var(--gold); }
  .sync-pill.err { color: var(--vermilion); background: var(--vermilion-soft); }
  .sync-pill.err .sync-dot { background: var(--vermilion); }

  /* ==================== WORKSPACE (2-PANE VERTICAL SCROLL) ==================== */
  .workspace {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
    position: relative;
  }

  /* LEFT INDEX SIDEBAR */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
    z-index: 40;
    transition: transform 0.22s ease;
  }
  .sidebar.hidden-mode { display: none; }
  .sidebar-top {
    padding: 12px 12px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-wrap .ico {
    position: absolute;
    left: 10px;
    color: var(--muted);
    pointer-events: none;
  }
  .search-box {
    width: 100%;
    padding: 7px 10px 7px 31px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    font-size: 12.5px;
    font-family: inherit;
    outline: none;
  }
  .search-box:focus { border-color: var(--vermilion); background: var(--surface); }
  .sidebar-filters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .mini-chip {
    justify-content: center;
    font-size: 12px;
    padding: 5px 8px;
  }
  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .sess-group-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    padding: 12px 8px 5px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 2;
  }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 6px 9px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--ink-2);
    margin-bottom: 2px;
    border-left: 2px solid transparent;
    transition: background 0.12s, color 0.12s;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item.active {
    background: var(--vermilion-soft);
    color: var(--vermilion);
    border-left-color: var(--vermilion);
    font-weight: 600;
  }
  .nav-item-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .nav-badges {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .dot-wrong-mini {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--vermilion);
    display: inline-block;
  }

  /* RIGHT CONTINUOUS SCROLL STAGE */
  .stage {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 20px 28px 64px;
    scroll-behavior: smooth;
  }
  .stage-inner {
    max-width: 820px;
    margin: 0 auto;
  }
  .stage-inner.wide { max-width: 1080px; }

  /* EDITORIAL SESSION DIVIDER */
  .session-heading {
    font-family: var(--font-serif);
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    margin: 28px 0 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--ink);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .session-heading:first-child { margin-top: 4px; }

  /* EDITORIAL STUDY SHEET CARD */
  .study-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 22px;
    margin-bottom: 16px;
    scroll-margin-top: 16px;
    transition: border-color 0.15s;
  }
  .study-card.is-bookmarked {
    border-color: var(--gold-border);
    box-shadow: inset 3px 0 0 var(--gold);
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding-bottom: 10px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .card-title {
    margin: 0;
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 700;
    color: var(--indigo);
  }
  .card-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* JAPANESE TEXTBOOK PROMPT BOX */
  .jp-prompt {
    background: var(--surface-2);
    border-left: 3px solid var(--vermilion);
    border-radius: 0 6px 6px 0;
    padding: 13px 16px;
    margin-bottom: 12px;
    font-family: var(--font-serif);
    font-size: 16.5px;
    line-height: 1.85;
    color: var(--ink);
  }
  .jp-prompt p { margin: 4px 0; }
  .jp-prompt u {
    text-decoration: underline;
    text-decoration-color: var(--vermilion);
    text-decoration-thickness: 2.5px;
    text-underline-offset: 5px;
    background: var(--vermilion-soft);
    color: var(--vermilion);
    padding: 1px 5px;
    border-radius: 3px;
  }
  .jp-prompt code {
    font-family: var(--font-sans);
    font-size: 13.5px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    padding: 2px 8px;
    border-radius: 4px;
    display: inline-block;
    margin: 2px 1px;
  }

  /* ANSWER & EXPLANATION */
  blockquote {
    border-left: 3px solid var(--indigo);
    background: var(--indigo-soft);
    padding: 11px 15px;
    margin: 10px 0;
    border-radius: 0 6px 6px 0;
    font-size: 14.5px;
  }
  blockquote p { margin: 4px 0; }
  ul, ol { margin: 6px 0; padding-left: 20px; font-size: 14.5px; color: var(--ink-2); }
  li { margin: 4px 0; }
  strong { color: var(--ink); }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 8px 0;
    font-size: 14px;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
  }
  th {
    background: var(--surface-2);
    font-weight: 700;
    font-size: 12.5px;
    color: var(--ink);
  }
  tr.is-bookmarked { background: var(--gold-soft); }
  .bm-cell { width: 44px; text-align: center; }

  code {
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: "Noto Sans JP", Consolas, monospace;
    font-size: 0.92em;
  }
  code.jp-pill {
    cursor: pointer;
    transition: border-color 0.14s, background 0.14s;
  }
  code.jp-pill:hover { border-color: var(--gold); background: var(--gold-soft); }
  code.jp-pill .pill-star { margin-left: 4px; font-size: 11px; color: var(--muted); }
  code.jp-pill.bookmarked {
    background: var(--gold-soft);
    border-color: var(--gold-border);
    color: var(--gold);
    font-weight: 700;
  }
  code.jp-pill.bookmarked .pill-star { color: var(--gold); }

  .bm-btn {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 99px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: inherit;
    white-space: nowrap;
  }
  .bm-btn:hover { border-color: var(--gold); color: var(--gold); }
  .bm-btn.bookmarked {
    background: var(--gold-soft);
    border-color: var(--gold-border);
    color: var(--gold);
  }
  .tts-btn {
    font-size: 12px;
    padding: 4px 9px;
    border-radius: 99px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink-2);
    cursor: pointer;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: inherit;
  }
  .tts-btn:hover { border-color: var(--indigo); color: var(--indigo); }

  .toggle-ans-btn { display: none; margin: 6px 0; }
  body.quiz-mode .toggle-ans-btn { display: inline-flex; }
  body.quiz-mode .q-answer { display: none; }
  body.quiz-mode .q-answer.revealed { display: block; }

  /* ==================== FLASHCARD (EDITORIAL PAPER CARD) ==================== */
  .fc-wrap {
    max-width: 780px;
    margin: 0 auto;
  }
  .fc-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .fc-card {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-top: 3px solid var(--vermilion);
    border-radius: 10px;
    padding: 28px 28px;
    min-height: 290px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: pointer;
    margin-bottom: 16px;
    transition: border-color 0.16s, background 0.16s;
  }
  .fc-card:hover { border-color: var(--vermilion); }
  .fc-word {
    font-family: var(--font-serif);
    font-size: 34px;
    font-weight: 700;
    color: var(--ink);
    text-align: center;
    margin: 10px 0;
  }
  .fc-reading {
    font-size: 17px;
    font-weight: 600;
    color: var(--vermilion);
    text-align: center;
    margin-bottom: 6px;
  }
  .fc-meaning {
    font-size: 15.5px;
    color: var(--ink-2);
    text-align: center;
    max-width: 560px;
    margin: 0 auto;
  }
  .fc-controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* ==================== EXAM MODE (2-COLUMN EDITORIAL) ==================== */
  .exam-setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--vermilion);
    border-radius: 10px;
    padding: 24px 26px;
    max-width: 860px;
    margin: 6px auto;
  }
  .exam-grid-setup {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;
    margin: 18px 0;
  }
  .exam-field {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 13px;
  }
  .exam-field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 9px;
  }
  .pill-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .choice-pill {
    padding: 5px 11px;
    border-radius: 5px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink-2);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .choice-pill.active {
    background: var(--vermilion);
    color: #FFFDF9;
    border-color: var(--vermilion);
  }
  .custom-count-input {
    width: 78px;
    padding: 5px 8px;
    border: 1px solid var(--border-strong);
    border-radius: 5px;
    background: var(--surface);
    color: var(--ink);
    font-size: 12.5px;
    font-family: inherit;
  }

  .exam-2col {
    display: grid;
    grid-template-columns: 1fr 255px;
    gap: 16px;
    align-items: start;
  }
  .exam-main-card, .exam-side-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
  }
  .exam-side-card { position: sticky; top: 0; }
  .exam-progress-track {
    width: 100%;
    height: 5px;
    background: var(--surface-2);
    border-radius: 99px;
    overflow: hidden;
    margin: 10px 0 14px;
  }
  .exam-progress-fill {
    height: 100%;
    background: var(--vermilion);
    transition: width 0.2s;
  }
  .exam-options-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 14px 0;
  }
  .exam-options-grid.single-col { grid-template-columns: 1fr; }
  .exam-opt-btn {
    width: 100%;
    text-align: left;
    padding: 11px 14px;
    font-size: 15px;
    border-radius: 6px;
    border: 1.5px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    line-height: 1.5;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-sans);
    transition: border-color 0.14s, background 0.14s;
  }
  .exam-opt-btn:hover:not(:disabled) { border-color: var(--indigo); background: var(--indigo-soft); }
  .exam-opt-btn.selected { border-color: var(--indigo); background: var(--indigo-soft); font-weight: 700; }
  .exam-opt-btn.correct { border-color: var(--matcha); background: var(--matcha-soft); color: var(--matcha); font-weight: 700; }
  .exam-opt-btn.wrong { border-color: var(--vermilion); background: var(--vermilion-soft); color: var(--vermilion); }
  .exam-opt-num {
    min-width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
  }
  .exam-opt-btn.selected .exam-opt-num { background: var(--indigo); border-color: var(--indigo); color: #FFFDF9; }
  .exam-opt-btn.correct .exam-opt-num { background: var(--matcha); border-color: var(--matcha); color: #FFFDF9; }
  .exam-opt-btn.wrong .exam-opt-num { background: var(--vermilion); border-color: var(--vermilion); color: #FFFDF9; }

  .exam-dots-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin: 10px 0 14px;
  }
  .exam-dot {
    height: 30px;
    border-radius: 5px;
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--ink-2);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .exam-dot.current { border: 2px solid var(--vermilion); color: var(--vermilion); }
  .exam-dot.answered { background: var(--indigo-soft); border-color: var(--indigo); color: var(--indigo); }
  .exam-dot.dot-correct { background: var(--matcha); border-color: var(--matcha); color: #FFFDF9; }
  .exam-dot.dot-wrong { background: var(--vermilion); border-color: var(--vermilion); color: #FFFDF9; }

  .exam-score-box {
    text-align: center;
    padding: 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--vermilion);
    border-radius: 10px;
    margin-bottom: 18px;
  }
  .exam-score-big { font-family: var(--font-serif); font-size: 40px; font-weight: 800; color: var(--vermilion); }
  .review-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .review-item.is-wrong { border-left: 3px solid var(--vermilion); }
  .review-item.is-right { border-left: 3px solid var(--matcha); }

  /* ==================== DRAWER & MODALS ==================== */
  .backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(28, 25, 23, 0.45);
    z-index: 90;
  }
  .backdrop.open { display: block; }
  .drawer {
    position: fixed;
    top: 0;
    right: -460px;
    width: 420px;
    max-width: 95vw;
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 100;
    display: flex;
    flex-direction: column;
    transition: right 0.22s ease;
  }
  .drawer.open { right: 0; }
  .drawer-header, .modal-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .drawer-body { flex: 1; overflow-y: auto; padding: 14px; }
  .drawer-footer {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 500px;
    max-width: 94vw;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    z-index: 110;
  }
  .modal.open { display: block; }
  .modal-body { padding: 16px; }
  .bm-item {
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: var(--bg);
  }
  .bm-item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .bm-item-title { font-weight: 700; font-size: 14px; color: var(--ink); }
  .bm-item-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
  .bm-item-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .quick-add {
    display: flex;
    flex-direction: column;
    gap: 7px;
    background: var(--bg);
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
  }
  .quick-add input {
    padding: 7px 9px;
    border: 1px solid var(--border-strong);
    border-radius: 5px;
    background: var(--surface);
    color: var(--ink);
    font-size: 12.5px;
    font-family: inherit;
  }

  .empty-state {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 36px 24px;
    text-align: center;
    max-width: 560px;
    margin: 28px auto;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--ink);
    color: var(--bg);
    padding: 9px 18px;
    border-radius: 99px;
    font-size: 12.5px;
    font-weight: 600;
    z-index: 200;
    opacity: 0;
    transition: transform 0.22s ease, opacity 0.22s ease;
    pointer-events: none;
    max-width: 92vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  .tag-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--indigo-soft);
    color: var(--indigo);
  }
  .tag-pill.word { background: var(--gold-soft); color: var(--gold); }
  .tag-pill.done { background: var(--matcha-soft); color: var(--matcha); }

  .done-btn {
    font-size: 12px;
    padding: 4px 9px;
    border-radius: 99px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: inherit;
    white-space: nowrap;
  }
  .done-btn:hover { border-color: var(--matcha); color: var(--matcha); }
  .done-btn.is-done {
    background: var(--matcha-soft);
    border-color: rgba(45, 106, 79, 0.35);
    color: var(--matcha);
  }
  .study-card.is-done { opacity: 0.92; }
  .sess-prog {
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 600;
    color: var(--matcha);
    background: var(--matcha-soft);
    padding: 2px 9px;
    border-radius: 99px;
    white-space: nowrap;
  }
  .dot-done-mini {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--matcha);
    display: inline-block;
  }
  .scroll-top-btn {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 55;
    box-shadow: 0 4px 12px rgba(28,25,23,0.12);
  }
  .scroll-top-btn.show { display: inline-flex; }
  .scroll-top-btn:hover { border-color: var(--vermilion); color: var(--vermilion); }

  /* ==================== RESPONSIVE (MOBILE & TABLET) ==================== */
  @media (max-width: 960px) {
    body { overflow: auto; height: auto; min-height: 100%; }
    .topbar {
      position: sticky;
      top: 0;
      height: auto;
      padding: 8px 10px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .mobile-menu-btn { display: inline-flex; min-width: 38px; min-height: 38px; justify-content: center; }
    .brand-title { display: none; }
    .top-center { order: 3; width: 100%; overflow-x: auto; padding-bottom: 2px; }
    .tab-btn.active::after { display: none; }
    .workspace { overflow: visible; }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      transform: translateX(-105%);
      z-index: 95;
    }
    .sidebar.mobile-open { transform: translateX(0); }
    .stage { overflow: visible; padding: 12px 12px 48px; }
    .study-card { padding: 14px 14px; }
    .jp-prompt { font-size: 15.5px; padding: 11px 13px; }
    .exam-2col { grid-template-columns: 1fr; }
    .exam-options-grid { grid-template-columns: 1fr; }
    .btn, .tab-btn, .bm-btn, .tts-btn { min-height: 36px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="top-left">
    <button class="btn btn-icon mobile-menu-btn" onclick="toggleMobileSidebar()" aria-label="Mở mục lục">
      <svg class="ico" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="brand">
      <span class="hanko">N1</span>
      <span class="brand-title">JLPT N1</span>
    </div>
    <button class="sync-pill" id="syncPill" onclick="fetchPublicMarkdownFiles(true)" title="Tải lại 3 file .md mới nhất từ Google Drive">
      <span class="sync-dot"></span><span id="syncLabel">Đang tải</span>
    </button>
  </div>

  <nav class="top-center" aria-label="Chuyển mục học">
    <div class="nav-tabs">
      <button class="tab-btn active" data-tab="tuvung" onclick="switchTab('tuvung')">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>Từ vựng</span>
      </button>
      <button class="tab-btn" data-tab="nguphap" onclick="switchTab('nguphap')">
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Ngữ pháp</span>
      </button>
      <button class="tab-btn" data-tab="dochieu" onclick="switchTab('dochieu')">
        <svg class="ico" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>Đọc hiểu</span>
      </button>
      <button class="tab-btn" data-tab="flashcard" onclick="switchTab('flashcard')">
        <svg class="ico" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        <span>Flashcard</span>
      </button>
      <button class="tab-btn" data-tab="exam" onclick="switchTab('exam')">
        <svg class="ico" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Thi thử</span>
      </button>
    </div>
  </nav>

  <div class="top-right">
    <button class="btn btn-primary" id="authBtn" onclick="handleAuthClick()" title="Đăng nhập Gmail để đồng bộ dữ liệu riêng">
      <svg class="ico" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Đăng nhập</span>
    </button>
    <button class="btn btn-gold-soft" onclick="openDrawer()" aria-label="Mở sổ Bookmark">
      <svg class="ico ico-fill" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span id="bmCount">0</span>
    </button>
    <button class="btn btn-icon" id="themeBtn" onclick="toggleTheme()" aria-label="Đổi giao diện Sáng/Tối">
      <svg class="ico" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="btn btn-icon" onclick="openSettings()" aria-label="Cài đặt">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<div class="workspace">
  <!-- LEFT INDEX SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="search-wrap">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-box" id="searchInput" type="text" placeholder="Tìm từ, nghĩa, câu..." oninput="renderCurrentView()">
      </div>
      <div class="sidebar-filters">
        <button class="btn mini-chip" id="filterBmBtn" onclick="toggleFilterBookmarked()">
          <svg class="ico" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>Bookmark</span>
        </button>
        <button class="btn mini-chip" id="quizBtn" onclick="toggleQuizMode()">
          <svg class="ico" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Tự nhẩm</span>
        </button>
      </div>
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
  </aside>

  <!-- RIGHT CONTINUOUS VERTICAL SCROLL STAGE -->
  <main class="stage" id="stageScroll">
    <div class="stage-inner" id="stageRoot"></div>
  </main>
</div>

<div class="backdrop" id="sidebarBackdrop" onclick="closeMobileSidebar()"></div>

<!-- Bookmark Drawer -->
<div class="backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <strong style="font-family:var(--font-serif);font-size:16px;">Sổ tay Bookmark (<span id="bmCountDrawer">0</span>)</strong>
    <button class="btn btn-icon" onclick="closeDrawer()" aria-label="Đóng">
      <svg class="ico" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:11.5px;color:var(--muted);">
      <span id="bmSyncInfo">Lưu trên máy (Đăng nhập Gmail để đồng bộ)</span>
      <button class="btn" onclick="pushUserCloudState(true)" style="padding:3px 9px;font-size:11.5px;">Đồng bộ</button>
    </div>
    <div class="quick-add">
      <input id="customWord" type="text" placeholder="Thêm từ mới (VD: 肝に銘じる)">
      <input id="customNote" type="text" placeholder="Cách đọc / Nghĩa (VD: きもにめいじる - khắc cốt ghi tâm)">
      <button class="btn btn-primary" onclick="addCustomBookmark()" style="justify-content:center;">Lưu vào Bookmark</button>
    </div>
    <div class="search-wrap" style="margin-bottom:10px;">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="bmDrawerSearch" type="text" class="search-box" placeholder="Lọc trong sổ Bookmark..." oninput="renderDrawerList()">
    </div>
    <div id="bmList"></div>
  </div>
  <div class="drawer-footer">
    <button class="btn" onclick="exportMarkdown()">Xuất .MD</button>
    <button class="btn" onclick="exportJson()">Sao lưu JSON</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">Khôi phục</button>
    <input id="importFile" type="file" accept=".json" style="display:none" onchange="importJson(event)">
  </div>
</aside>

<!-- Settings Modal -->
<div class="backdrop" id="settingsBackdrop" onclick="closeSettings()"></div>
<div class="modal" id="settingsModal">
  <div class="modal-header">
    <strong style="font-family:var(--font-serif);font-size:16px;">Tài khoản &amp; Dữ liệu</strong>
    <button class="btn btn-icon" onclick="closeSettings()" aria-label="Đóng">
      <svg class="ico" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="modal-body">
    <div id="accountInfoBox" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:14px;font-size:13px;"></div>
    <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12.5px;color:var(--ink-2);margin-bottom:14px;">
      <strong style="color:var(--ink);">Nguồn bài học (Google Drive)</strong>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="fetchPublicMarkdownFiles(true);closeSettings();">Tải lại 3 file .md</button>
        <button class="btn" onclick="document.getElementById('localMdInput').click()">Nạp file .md từ máy</button>
        <input id="localMdInput" type="file" accept=".md,.txt" multiple style="display:none" onchange="loadLocalMarkdownFiles(event)">
        <button class="btn" onclick="clearLocalCache()" style="color:var(--vermilion);">Xóa cache</button>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;">
      <button class="btn" onclick="closeSettings()">Đóng</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<button class="scroll-top-btn" id="scrollTopBtn" onclick="scrollStageToTop()" aria-label="Lên đầu trang" title="Lên đầu trang">
  <svg class="ico" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
</button>

<script>
// ==================== SVG ICON HELPERS ====================
const ICONS = {
  star: '<svg class="ico" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
  starFill: '<svg class="ico ico-fill" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
  volume: '<svg class="ico" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>',
  eye: '<svg class="ico" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  close: '<svg class="ico" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  moon: '<svg class="ico" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',

// ==================== MARKDOWN PARSER ====================
function renderMdFragment(mdText) {
  if (!mdText) return "";
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); return marked.parse(mdText); }
  return "<pre>" + escapeHtml(mdText) + "</pre>";
}

function parseMarkdownToSections(mdText) {
  const lines = mdText.replace(/\r\n/g, "\n").split("\n");
  const sessions = [];
  let curSession = null, curBlockLines = [], curBlockTitle = null, curBlockType = "intro";

  function flushBlock() {
    if (!curSession) return;
    const bodyMd = curBlockLines.join("\n").trim();
    if (!bodyMd && !curBlockTitle) { curBlockLines = []; return; }
    curSession.blocks.push({ type: curBlockType, title: curBlockTitle || "", body_md: bodyMd });
    curBlockLines = []; curBlockTitle = null; curBlockType = "section";
  }

  for (const line of lines) {
    if (line.startsWith("# ")) {
      flushBlock();
      curSession = { title: line.slice(2).trim(), blocks: [] };
      sessions.push(curSession);
      curBlockType = "intro"; curBlockTitle = null; curBlockLines = [];
    } else if (!curSession) {
      curSession = { title: "Tổng quan", blocks: [] };
      sessions.push(curSession);
      curBlockLines.push(line);
    } else if (line.startsWith("### ")) {
      flushBlock(); curBlockTitle = line.slice(4).trim(); curBlockType = "question"; curBlockLines = [];
    } else if (line.startsWith("## ")) {
      flushBlock();
      const h2 = line.slice(3).trim();
      curBlockTitle = h2;
      const u = h2.toUpperCase();
      curBlockType = (u.includes("CHEAT SHEET") || u.includes("BẢNG TỔNG KẾT")) ? "cheatsheet" : "section";
      curBlockLines = [];
    } else {
      curBlockLines.push(line);
    }
  }
  flushBlock();
  return sessions;
}

function enhanceCheatsheetTable(htmlStr, sessionTitle, tabId, collectWords = false) {
  const tmp = document.createElement("div");
  tmp.innerHTML = htmlStr;
  tmp.querySelectorAll("table").forEach(table => {
    const theadRow = table.querySelector("thead tr");
    if (theadRow) {
      const th = document.createElement("th");
      th.textContent = "Lưu";
      theadRow.insertBefore(th, theadRow.firstChild);
    }
    table.querySelectorAll("tbody tr").forEach(tr => {
      const cells = tr.querySelectorAll("td");
      if (!cells.length) return;
      const wordText = (cells[0]?.textContent || "").trim();
      const readingText = (cells[1]?.textContent || "").trim();
      const meaningText = (cells[2]?.textContent || "").trim();
      const itemId = `word::${tabId}::${wordText}::${readingText}`;
      tr.dataset.bmRow = itemId;

      if (collectWords && wordText && JP_RE.test(wordText)) {
        cheatWordsBank.push({ id: itemId, kind: "word", title: wordText, sub: readingText, note: meaningText, session: sessionTitle });
      }

      const td = document.createElement("td");
      td.className = "bm-cell";
      const btn = document.createElement("button");
      btn.className = "bm-btn";
      btn.dataset.bmId = itemId;
      btn.dataset.bmKind = "word";
      btn.dataset.bmTitle = wordText;
      btn.dataset.bmSub = readingText;
      btn.dataset.bmNote = meaningText;
      btn.dataset.bmSession = sessionTitle;
      btn.innerHTML = ICONS.star;
      td.appendChild(btn);
      tr.insertBefore(td, tr.firstChild);
    });
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
  });
  return tmp.innerHTML;
}

function makeCodePillsClickable(htmlStr, sessionTitle) {
  const tmp = document.createElement("div");
  tmp.innerHTML = htmlStr;
  tmp.querySelectorAll("code").forEach(codeEl => {
    if (codeEl.closest("pre")) return;
    const plain = (codeEl.textContent || "").trim();
    if (!plain || !JP_RE.test(plain) || plain.length > 60) return;
    if (/^[1-4１-４][.．]/.test(plain)) return;
    const itemId = `term::${plain}`;
    codeEl.classList.add("jp-pill");
    codeEl.dataset.bmId = itemId;
    codeEl.dataset.bmKind = "term";
    codeEl.dataset.bmTitle = plain;
    codeEl.dataset.bmSub = "";
    codeEl.dataset.bmNote = `Từ mở rộng (${sessionTitle})`;
    codeEl.dataset.bmSession = sessionTitle;
    codeEl.title = "Bấm để Bookmark từ này";
    const star = document.createElement("span");
    star.className = "pill-star";
    star.textContent = "☆";
    codeEl.appendChild(star);
  });
  return tmp.innerHTML;
}

function buildTabItems(tabId, mdText) {
  if (!mdText || !mdText.trim()) return [];
  const sessions = parseMarkdownToSections(mdText);
  const items = [];
  sessions.forEach((sess, sIdx) => {
    const sTitle = sess.title;
    sess.blocks.forEach((blk, bIdx) => {
      const bMd = blk.body_md;
      const bTitle = blk.title || (blk.type === "intro" ? "Tổng quan buổi học" : `Mục ${bIdx + 1}`);
      if (blk.type === "intro" && !bMd.replace(/[-*_]/g, "").trim()) return;

      if (blk.type === "question") {
        const parts = bMd.split(/\n?\*\(Khoảng trống tự nhẩm đáp án\)\*\n?/);
        let promptHtml = "", answerHtml = "", promptPlain = "";
        if (parts.length >= 2) {
          promptHtml = renderMdFragment(parts[0]);
          answerHtml = makeCodePillsClickable(renderMdFragment(parts.slice(1).join("\n")), sTitle);
          promptPlain = parts[0].replace(/<[^>]+>/g, "").replace(/[`*#>]/g, "").trim();
        } else {
          answerHtml = makeCodePillsClickable(renderMdFragment(bMd), sTitle);
          promptPlain = bMd.split("\n")[0].replace(/<[^>]+>/g, "").replace(/[`*#>]/g, "").trim();
        }
        const qId = `q::${tabId}::${sIdx}::${blk.title}`;
        const jpSentence = (promptPlain.split("\n").find(l => JP_RE.test(l)) || "").trim();
        items.push({
          id: qId, tabId, type: "question", sessionTitle: sTitle, title: blk.title,
          shortLabel: blk.title.replace(/`\[[^\]]+\]`/g, "").trim(),
          preview: jpSentence || promptPlain.slice(0, 120),
          jpText: jpSentence, promptHtml, answerHtml,
          searchText: (sTitle + " " + blk.title + " " + bMd).toLowerCase()
        });
      } else if (blk.type === "cheatsheet") {
        let html = enhanceCheatsheetTable(renderMdFragment(bMd), sTitle, tabId, true);
        html = makeCodePillsClickable(html, sTitle);
        items.push({
          id: `cs::${tabId}::${sIdx}::${bIdx}`, tabId, type: "cheatsheet", sessionTitle: sTitle,
          title: bTitle, shortLabel: bTitle, preview: "", jpText: "",
          promptHtml: "", answerHtml: html,
          searchText: (sTitle + " " + bTitle + " " + bMd).toLowerCase()
        });
      } else {
        const html = makeCodePillsClickable(renderMdFragment(bMd), sTitle);
        items.push({
          id: `sec::${tabId}::${sIdx}::${bIdx}`, tabId, type: "section", sessionTitle: sTitle,
          title: bTitle, shortLabel: bTitle, preview: "", jpText: "",
          promptHtml: "", answerHtml: html,
          searchText: (sTitle + " " + bTitle + " " + bMd).toLowerCase()
        });
      }
    });
  });
  return items;
}

function extractQuizQuestions(tabId, mdText) {
  if (!mdText) return [];
  const sessions = parseMarkdownToSections(mdText);
  const questions = [];
  sessions.forEach((sess, sIdx) => {
    sess.blocks.forEach(blk => {
      if (blk.type !== "question") return;
      const parts = blk.body_md.split(/\n?\*\(Khoảng trống tự nhẩm đáp án\)\*\n?/);
      if (parts.length < 2) return;
      const promptMd = parts[0].trim();
      const answerMd = parts.slice(1).join("\n").trim();
      const ansMatch = answerMd.match(/Đáp án(?:\s*\(★\))?:\**\s*`?([1-4])/);
      if (!ansMatch) return;
      const correctNum = parseInt(ansMatch[1], 10);

      let options = [], cleanPromptMd = promptMd;
      const btMatches = [...promptMd.matchAll(/`([1-4])\.\s*([^`]+)`/g)];
      if (btMatches.length >= 4) {
        const byNum = {};
        btMatches.forEach(m => { byNum[m[1]] = m[2].trim(); });
        if (byNum["1"] && byNum["2"] && byNum["3"] && byNum["4"]) {
          options = [byNum["1"], byNum["2"], byNum["3"], byNum["4"]];
          cleanPromptMd = promptMd.split("\n").filter(l => !/`[1-4]\./.test(l)).join("\n").trim();
        }
      }
      if (options.length !== 4) {
        const byNum = {}, kept = [];
        promptMd.split("\n").forEach(line => {
          const m = line.match(/^\s*([1-4])\.\s+(.+)$/);
          if (m && !byNum[m[1]]) byNum[m[1]] = m[2].trim();
          else kept.push(line);
        });
        if (byNum["1"] && byNum["2"] && byNum["3"] && byNum["4"]) {
          options = [byNum["1"], byNum["2"], byNum["3"], byNum["4"]];
          cleanPromptMd = kept.join("\n").trim();
        }
      }
      if (options.length !== 4) return;
      const qId = `q::${tabId}::${sIdx}::${blk.title}`;
      const firstLine = (cleanPromptMd.split("\n")[0] || "").replace(/<[^>]+>/g, "").replace(/[`*#>]/g, "").trim();

      questions.push({
        id: qId, tabId,
        categoryLabel: tabId === "tuvung" ? "Từ vựng" : "Ngữ pháp",
        sessionTitle: sess.title, title: blk.title,
        promptHtml: renderMdFragment(cleanPromptMd),
        promptPlain: firstLine,
        options, longOpts: options.some(o => o.length > 22),
        correct: correctNum,
        explanationHtml: renderMdFragment(answerMd)
      });
    });
  });
  return questions;
}

function getFilteredItems(tabId) {
  const q = (document.getElementById("searchInput")?.value || "").trim().toLowerCase();
  return (tabItems[tabId] || []).filter(item => {
    const matchQ = !q || item.searchText.includes(q);
    const matchBm = !onlyBookmarked || isItemBookmarked(item);
    return matchQ && matchBm;
  });
}

function isItemBookmarked(item) {
  if (bmState.items[item.id]) return true;
  if (item.type === "cheatsheet") {
    return Object.keys(bmState.items).some(k => k.startsWith("word::") && item.answerHtml.includes(escapeHtml(k)));
  }
  return false;
}

      const st = sessStats[lastSess];
      const progBadge = st && st.total ? `<span class="sess-prog">${st.done} / ${st.total} đã học</span>` : "";
      html += `<h1 class="session-heading"><span>${escapeHtml(lastSess)}</span>${progBadge}</h1>`;

              </button>
            ` : ""}
          </div>
        </div>
        ${item.promptHtml ? `<div class="jp-prompt">${item.promptHtml}</div>` : ""}
        <div class="q-answer-wrap">
          ${item.promptHtml ? `<button class="btn toggle-ans-btn" onclick="toggleOneAns(this)">${ICONS.eye}<span>Hiện / Ẩn đáp án</span></button>` : ""}
          <div class="q-answer">${item.answerHtml}</div>
        </div>
      </article>
    `;
  });
  root.innerHTML = html;
  if (preserveScroll) scrollEl.scrollTop = prevTop;
  syncBookmarkBadgesOnly();
  bindScrollSpy();
}

function bindScrollSpy() {
  if (scrollSpyBound) return;
  scrollSpyBound = true;
  let spyTimer = null;
  const onScroll = () => {
    const stageEl = document.getElementById("stageScroll");
    const scrollY = window.innerWidth <= 960 ? window.scrollY : stageEl.scrollTop;
    document.getElementById("scrollTopBtn").classList.toggle("show", scrollY > 360);

    if (!["tuvung", "nguphap", "dochieu"].includes(currentTab)) return;
    clearTimeout(spyTimer);
    spyTimer = setTimeout(() => {
      const cards = document.querySelectorAll("#stageRoot .study-card[data-idx]");
      if (!cards.length) return;
      const refTop = window.innerWidth <= 960 ? 110 : stageEl.getBoundingClientRect().top + 48;
      let activeIdx = 0;
      for (const c of cards) {
        if (c.getBoundingClientRect().top <= refTop) activeIdx = parseInt(c.dataset.idx, 10);
        else break;
      }
      document.querySelectorAll(".nav-item.active").forEach(el => el.classList.remove("active"));
      const navEl = document.getElementById("nav-item-" + activeIdx);
      if (navEl) {
        navEl.classList.add("active");
        if (window.innerWidth > 960) navEl.scrollIntoView({ block: "nearest" });
      }
      if (!onlyBookmarked && !(document.getElementById("searchInput")?.value || "").trim()) {
        lastReadMap[currentTab] = activeIdx;
        localStorage.setItem(KEYS.LAST_READ, JSON.stringify(lastReadMap));
      }
    }, 90);
  };
  document.getElementById("stageScroll").addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("scroll", onScroll, { passive: true });
}

function scrollStageToTop() {
  if (window.innerWidth <= 960) window.scrollTo({ top: 0, behavior: "smooth" });
  else document.getElementById("stageScroll").scrollTo({ top: 0, behavior: "smooth" });
}

function renderSidebar(list) {
  const el = document.getElementById("sidebarList");
  if (!list.length) {
    el.innerHTML = `<div style="padding:18px;text-align:center;color:var(--muted);font-size:12.5px;">Không có mục nào</div>`;
    return;
  }
  let html = "", lastSess = "";
  list.forEach((item, idx) => {
    if (item.sessionTitle !== lastSess) {
      lastSess = item.sessionTitle;
      html += `<div class="sess-group-title">${escapeHtml(lastSess)}</div>`;
    }
    const isBm = !!bmState.items[item.id];
    const isWrong = wrongIds.has(item.id);
    const isDone = doneIds.has(item.id);
    html += `
      <div class="nav-item" onclick="scrollToStudyItem(${idx})" id="nav-item-${idx}">
        <span class="nav-item-text">${escapeHtml(item.shortLabel)}</span>
        <span class="nav-badges">
          ${isDone ? '<span class="dot-done-mini" title="Đã học xong"></span>' : ''}
          ${isWrong ? '<span class="dot-wrong-mini" title="Từng làm sai"></span>' : ''}
          ${isBm ? `<span style="color:var(--gold);display:inline-flex;">${ICONS.starFill}</span>` : ''}
        </span>
      </div>
    `;
  });
  el.innerHTML = html;
}

function scrollToStudyItem(idx) {
  closeMobileSidebar();
  document.querySelectorAll(".nav-item.active").forEach(el => el.classList.remove("active"));
  document.getElementById("nav-item-" + idx)?.classList.add("active");
  const card = document.getElementById("list-item-" + idx);
  if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
}

function jumpToBookmarkedItem(id) {
  for (const t of ["tuvung", "nguphap", "dochieu"]) {
    const idx = (tabItems[t] || []).findIndex(it => it.id === id);
    if (idx !== -1) {
      closeDrawer();
      onlyBookmarked = false;
      document.getElementById("filterBmBtn").classList.remove("btn-active-gold");
      const s = document.getElementById("searchInput");
      if (s) s.value = "";
      currentTab = t;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
      renderCurrentView();
      setTimeout(() => scrollToStudyItem(idx), 60);
      return;
    }
  }
}

// ==================== FLASHCARD ENGINE (SRS: ĐÃ THUỘC / ÔN LẠI) ====================
function getRawFlashcardSource() {
  const allBms = Object.values(bmState.items);
  if (fcConfig.source === "bookmarks") return allBms.map(it => ({ ...it }));
  if (fcConfig.source === "bm_words") return allBms.filter(it => it.kind !== "question").map(it => ({ ...it }));
  if (fcConfig.source === "bm_questions") return allBms.filter(it => it.kind === "question").map(it => ({ ...it }));
  return cheatWordsBank.map(w => ({ ...w, kind: "word" }));
}

function buildFlashcardDeck() {
  const raw = getRawFlashcardSource();
  fcDeck = fcConfig.showMastered ? raw : raw.filter(c => !masteredIds.has(c.id));
  fcIdx = 0; fcFlipped = false;
}

function renderFlashcardView() {
  const root = document.getElementById("stageRoot");
  const allBms = Object.values(bmState.items);
  const bmWordsCnt = allBms.filter(it => it.kind !== "question").length;
  const bmQsCnt = allBms.filter(it => it.kind === "question").length;
  const csCnt = cheatWordsBank.length;
  const rawTotal = getRawFlashcardSource();
  const masteredInSource = rawTotal.filter(c => masteredIds.has(c.id)).length;

  const filterBar = `
    <div class="fc-toolbar">
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn ${fcConfig.source==='bookmarks'?'btn-primary':''}" onclick="switchFlashcardSource('bookmarks')">Tất cả BM (${allBms.length})</button>
        <button class="btn ${fcConfig.source==='bm_words'?'btn-primary':''}" onclick="switchFlashcardSource('bm_words')">Từ vựng (${bmWordsCnt})</button>
        <button class="btn ${fcConfig.source==='bm_questions'?'btn-primary':''}" onclick="switchFlashcardSource('bm_questions')">Bài tập (${bmQsCnt})</button>
        <button class="btn ${fcConfig.source==='cheatsheet'?'btn-primary':''}" onclick="switchFlashcardSource('cheatsheet')">Cheat Sheet (${csCnt})</button>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
        <span class="tag-pill done">Đã thuộc: ${masteredInSource}/${rawTotal.length}</span>
        <button class="btn ${fcConfig.showMastered?'btn-active-matcha':''}" onclick="toggleShowMastered()" style="font-size:12px;padding:4px 9px;">${fcConfig.showMastered ? "Đang hiện cả đã thuộc" : "Ẩn đã thuộc"}</button>
        ${fcDeck.length ? `<button class="btn" onclick="shuffleFlashcards()" style="font-size:12px;padding:4px 9px;">${ICONS.shuffle}<span>Xáo</span></button>` : ""}
      </div>
    </div>
  `;

  if (!fcDeck.length) {
    const allDone = rawTotal.length > 0 && masteredInSource === rawTotal.length;
    root.innerHTML = `<div class="fc-wrap">${filterBar}<div class="empty-state">
      <h2 style="font-family:var(--font-serif);margin:0 0 8px;">${allDone ? "Xuất sắc — Bạn đã thuộc 100% thẻ trong mục này" : "Chưa có thẻ nào"}</h2>
      <p style="color:var(--muted);font-size:13.5px;margin:0 0 16px;">${allDone ? "Anh có thể đặt lại trạng thái đã thuộc để ôn vòng mới hoặc chuyển sang nguồn thẻ khác." : `Hãy đánh dấu Bookmark từ vựng/câu hỏi khó, hoặc chọn nguồn Cheat Sheet (${csCnt} từ).`}</p>
      ${allDone ? `<button class="btn btn-primary" onclick="resetMasteredInSource()">Ôn lại toàn bộ ${rawTotal.length} thẻ</button>` : ""}
    </div></div>`;
    return;
  }

  if (fcIdx >= fcDeck.length) fcIdx = 0;
  const card = fcDeck[fcIdx];
  const isQ = card.kind === "question";
  const fullQ = isQ ? findStudyItemById(card.id) : null;
  const speakText = isQ ? (fullQ?.jpText || card.sub || "") : card.title;
  const isMastered = masteredIds.has(card.id);

  let bodyHtml = "";
  if (isQ && fullQ) {
    bodyHtml = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap;">
        <span class="tag-pill">BÀI TẬP · ${escapeHtml(fullQ.shortLabel)}</span>
        <span style="font-size:12px;color:var(--muted);font-weight:600;">Thẻ ${fcIdx + 1}/${fcDeck.length} · ${fcFlipped ? "Mặt sau" : "Bấm thẻ hoặc Space"}</span>
      </div>
      <div class="jp-prompt" style="margin-bottom:8px;">${fullQ.promptHtml}</div>
      ${fcFlipped
        ? `<div style="margin-top:10px;padding-top:12px;border-top:1px dashed var(--border-strong);">${fullQ.answerHtml}</div>`
        : `<div style="font-size:13px;color:var(--muted);text-align:center;margin-top:12px;">Tự chọn đáp án 1–4 rồi bấm vào thẻ để kiểm tra lời giải</div>`}
    `;
  } else {
    const cleanSub = (card.sub || "").replace(/<[^>]+>/g, "");
    const cleanNote = (card.note || "").replace(/<[^>]+>/g, "");
    bodyHtml = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span class="tag-pill word">TỪ VỰNG</span>
        <span style="font-size:12px;color:var(--muted);font-weight:600;">Thẻ ${fcIdx + 1}/${fcDeck.length}</span>
      </div>
      <div class="fc-word">${escapeHtml(card.title)}</div>
      ${fcFlipped ? `
        ${cleanSub ? `<div class="fc-reading">${escapeHtml(cleanSub)}</div>` : ""}
        ${cleanNote ? `<div class="fc-meaning">${escapeHtml(cleanNote)}</div>` : ""}
        <div style="font-size:11.5px;color:var(--muted);text-align:center;margin-top:16px;">${escapeHtml(card.session || "")}</div>
      ` : `<div style="font-size:13px;color:var(--muted);text-align:center;margin-top:6px;">Tự nhẩm cách đọc và nghĩa tiếng Việt</div>`}
    `;
  }

  root.innerHTML = `
    <div class="fc-wrap">
      ${filterBar}
      <div class="fc-card" onclick="flipFlashcard()">${bodyHtml}</div>
      <div class="fc-controls">
        <button class="btn" onclick="stepFlashcard(-1)" ${fcIdx <= 0 ? "disabled" : ""}>Trước</button>
        ${speakText ? `<button class="btn" onclick='speakJapanese(${JSON.stringify(speakText)})'>${ICONS.volume}<span>Nghe</span></button>` : ""}
        <button class="btn btn-primary" onclick="flipFlashcard()">${fcFlipped ? "Úp thẻ" : "Lật xem đáp án"}</button>
        <button class="btn" onclick="markFlashcardAgain()" style="border-color:var(--vermilion);color:var(--vermilion);" title="Đưa thẻ này lặp lại sau 3 thẻ">Chưa thuộc (lặp lại)</button>
        <button class="btn btn-active-matcha" onclick="markFlashcardMastered()" title="Đánh dấu đã thuộc và ẩn khỏi vòng ôn">${ICONS.check}<span>${isMastered ? "Bỏ đã thuộc" : "Đã thuộc"}</span></button>
        <button class="btn" onclick="stepFlashcard(1)" ${fcIdx >= fcDeck.length - 1 ? "disabled" : ""}>Tiếp</button>
      </div>
    </div>
  `;
}

function toggleShowMastered() { fcConfig.showMastered = !fcConfig.showMastered; buildFlashcardDeck(); renderFlashcardView(); }
function markFlashcardMastered() {
  const card = fcDeck[fcIdx]; if (!card) return;
  if (masteredIds.has(card.id)) {
    masteredIds.delete(card.id);
    saveMasteredIds();
    showToast("Đã đưa thẻ trở lại danh sách cần ôn");
  } else {
    masteredIds.add(card.id);
    saveMasteredIds();
    if (!fcConfig.showMastered) fcDeck.splice(fcIdx, 1);
    else fcIdx = Math.min(fcIdx + 1, fcDeck.length - 1);
    showToast("Đã đánh dấu thuộc");
  }
  fcFlipped = false;
  if (fcIdx >= fcDeck.length) fcIdx = Math.max(0, fcDeck.length - 1);
  renderFlashcardView();
}
function markFlashcardAgain() {
  const card = fcDeck[fcIdx]; if (!card) return;
  masteredIds.delete(card.id);
  saveMasteredIds();
  fcDeck.splice(fcIdx, 1);
  const reinsertAt = Math.min(fcIdx + 3, fcDeck.length);
  fcDeck.splice(reinsertAt, 0, card);
  fcFlipped = false;
  if (fcIdx >= fcDeck.length) fcIdx = 0;
  showToast("Sẽ lặp lại thẻ này sau 3 thẻ nữa");
  renderFlashcardView();
}
function resetMasteredInSource() {
  getRawFlashcardSource().forEach(c => masteredIds.delete(c.id));
  saveMasteredIds();
  buildFlashcardDeck();
  renderFlashcardView();
  showToast("Đã đặt lại toàn bộ thẻ để ôn vòng mới");
}

function switchFlashcardSource(s) { fcConfig.source = s; buildFlashcardDeck(); renderFlashcardView(); }
function flipFlashcard() { fcFlipped = !fcFlipped; renderFlashcardView(); }
function stepFlashcard(d) { const n = fcIdx + d; if (n >= 0 && n < fcDeck.length) { fcIdx = n; fcFlipped = false; renderFlashcardView(); } }
function shuffleFlashcards() { fcDeck = shuffleArray(fcDeck); fcIdx = 0; fcFlipped = false; renderFlashcardView(); showToast("Đã xáo trộn bộ thẻ"); }

// ==================== EXAM ENGINE ====================
function getFilteredExamPool(source) {
  if (source === "tuvung") return parsedQuizBank.filter(q => q.tabId === "tuvung");
  if (source === "nguphap") return parsedQuizBank.filter(q => q.tabId === "nguphap");
  if (source === "bookmarked") return parsedQuizBank.filter(q => !!bmState.items[q.id]);
  if (source === "wrong") return parsedQuizBank.filter(q => wrongIds.has(q.id));
  return [...parsedQuizBank];
}

function renderExamView() {
  const root = document.getElementById("stageRoot");
  if (!parsedQuizBank.length) {
    root.innerHTML = `<div class="empty-state"><h2 style="font-family:var(--font-serif);">Thi thử JLPT N1</h2><p style="color:var(--muted);">Đang tải ngân hàng câu hỏi Từ vựng &amp; Ngữ pháp...</p><button class="btn btn-primary" onclick="fetchPublicMarkdownFiles(true)">Tải lại 3 file .md</button></div>`;
    return;
  }
  if (examSession) {
    if (examSession.finished) renderExamResult(root);
    else renderExamActive(root);
    return;
  }

  const vocabCnt = parsedQuizBank.filter(q => q.tabId === "tuvung").length;
  const gramCnt = parsedQuizBank.filter(q => q.tabId === "nguphap").length;
  const bmCnt = parsedQuizBank.filter(q => !!bmState.items[q.id]).length;
  const wrongCnt = parsedQuizBank.filter(q => wrongIds.has(q.id)).length;
  const poolSize = getFilteredExamPool(examConfig.source).length;
  const targetCnt = examConfig.count === "all" ? poolSize : Math.min(Number(examConfig.count) || 10, poolSize);

  root.innerHTML = `
    <div class="exam-setup-card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--border);padding-bottom:12px;">
        <h2 style="font-family:var(--font-serif);margin:0;font-size:21px;">Tạo đề thi thử JLPT N1</h2>
        <span style="font-size:12.5px;color:var(--muted);">Ngân hàng hiện có <strong>${parsedQuizBank.length} câu</strong> (${vocabCnt} Từ vựng · ${gramCnt} Ngữ pháp)</span>
      </div>

      <div class="exam-grid-setup">
        <div class="exam-field">
          <label>1. Nguồn câu hỏi</label>
          <div class="pill-group">
            <button class="choice-pill ${examConfig.source==='all'?'active':''}" onclick="setExamConfig('source','all')">Tất cả (${parsedQuizBank.length})</button>
            <button class="choice-pill ${examConfig.source==='tuvung'?'active':''}" onclick="setExamConfig('source','tuvung')">Từ vựng (${vocabCnt})</button>
            <button class="choice-pill ${examConfig.source==='nguphap'?'active':''}" onclick="setExamConfig('source','nguphap')">Ngữ pháp (${gramCnt})</button>
            <button class="choice-pill ${examConfig.source==='bookmarked'?'active':''}" onclick="setExamConfig('source','bookmarked')">Đã Bookmark (${bmCnt})</button>
            <button class="choice-pill ${examConfig.source==='wrong'?'active':''}" onclick="setExamConfig('source','wrong')">Câu hay sai (${wrongCnt})</button>
          </div>
        </div>

        <div class="exam-field">
          <label>2. Số câu ngẫu nhiên (tối đa ${poolSize})</label>
          <div class="pill-group" style="align-items:center;">
            ${[5, 10, 20, 30].map(n => `<button class="choice-pill ${examConfig.count===n?'active':''}" onclick="setExamConfig('count',${n})">${n}</button>`).join("")}
            <button class="choice-pill ${examConfig.count==='all'?'active':''}" onclick="setExamConfig('count','all')">Tất cả</button>
            <input class="custom-count-input" type="number" min="1" max="${Math.max(1, poolSize)}" placeholder="Tùy ý"

            <button class="choice-pill ${examConfig.mode==='submit'?'active':''}" onclick="setExamConfig('mode','submit')">Nộp bài mới chấm</button>
          </div>
        </div>
      </div>

      <div style="text-align:center;margin-top:18px;">
        <button class="btn btn-primary" onclick="startExam()" ${poolSize === 0 ? "disabled" : ""} style="padding:10px 28px;font-size:14.5px;">
          Bắt đầu làm bài (${targetCnt} câu)
        </button>
      </div>
    </div>

function setExamConfig(k, v) { examConfig[k] = v; renderExamView(); }
function setCustomExamCount(v) { const n = parseInt(v, 10); if (n > 0) { examConfig.count = n; renderExamView(); } }
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function formatDuration(sec) { return `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`; }

function startExam(customList = null) {
  const pool = customList || getFilteredExamPool(examConfig.source);
  if (!pool.length) { showToast("Không có câu hỏi nào."); return; }
  const desired = customList ? pool.length : (examConfig.count === "all" ? pool.length : Math.min(Number(examConfig.count) || 10, pool.length));
  examSession = { questions: shuffleArray(pool).slice(0, desired), answers: {}, currentIdx: 0, mode: examConfig.mode, startedAt: Date.now(), elapsedSec: 0, finished: false };
  clearInterval(examTimerInterval);
  examTimerInterval = setInterval(() => {
    if (!examSession || examSession.finished) return;
    examSession.elapsedSec = Math.floor((Date.now() - examSession.startedAt) / 1000);
    const el = document.getElementById("examTimer");
    if (el) el.textContent = formatDuration(examSession.elapsedSec);
  }, 1000);
  renderExamView();
}

          }).join("")}
        </div>

        ${showFeedback ? `
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--border);">
