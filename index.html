<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<title>JLPT N1 Pro — Học, Flashcard, Bookmark & Thi Thử</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --surface-hover: #f1f5f9;
    --text: #0f172a;
    --text-2: #475569;
    --muted: #64748b;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-soft: #eef2ff;
    --primary-border: #c7d2fe;
    --gold: #f59e0b;
    --gold-soft: #fef3c7;
    --gold-text: #92400e;
    --green: #10b981;
    --green-soft: #ecfdf5;
    --green-text: #065f46;
    --red: #ef4444;
    --red-soft: #fef2f2;
    --red-text: #991b1b;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08);
    --topbar-h: 54px;
    --sidebar-w: 295px;
    --radius: 12px;
  }

  [data-theme="dark"] {
    --bg: #0b1120;
    --surface: #111827;
    --surface-2: #1e293b;
    --surface-hover: #1f2937;
    --text: #f1f5f9;
    --text-2: #cbd5e1;
    --muted: #94a3b8;
    --primary: #6366f1;
    --primary-hover: #818cf8;
    --primary-soft: rgba(99, 102, 241, 0.16);
    --primary-border: rgba(99, 102, 241, 0.35);
    --gold: #fbbf24;
    --gold-soft: rgba(251, 191, 36, 0.15);
    --gold-text: #fcd34d;
    --green: #34d399;
    --green-soft: rgba(16, 185, 129, 0.15);
    --green-text: #6ee7b7;
    --red: #f87171;
    --red-soft: rgba(239, 68, 68, 0.15);
    --red-text: #fca5a5;
    --border: #1e293b;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Inter", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }

  /* Custom scrollbars */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* ==================== TOPBAR (SINGLE COMPACT ROW - 54px) ==================== */
  .topbar {
    height: var(--topbar-h);
    min-height: var(--topbar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    z-index: 60;
    box-shadow: var(--shadow-sm);
  }
  .top-left, .top-center, .top-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -0.3px;
    color: var(--text);
    white-space: nowrap;
  }
  .brand-badge {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 7px;
    border-radius: 7px;
    letter-spacing: 0.4px;
  }
  .mobile-menu-btn { display: none; }

  .nav-pills {
    display: flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 3px;
    border-radius: 10px;
    gap: 2px;
  }
  .tab-btn {
    border: none;
    background: transparent;
    color: var(--text-2);
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .tab-btn:hover { color: var(--text); background: var(--surface-hover); }
  .tab-btn.active {
    background: var(--surface);
    color: var(--primary);
    box-shadow: var(--shadow-sm);
  }
  .tab-btn.exam-tab.active { color: #7c3aed; }
  .tab-btn.fc-tab.active { color: #d97706; }

  .btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--muted); }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-icon { padding: 5px 8px; }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-gold {
    background: var(--gold-soft);
    border-color: var(--gold);
    color: var(--gold-text);
  }
  .btn-active-green {
    background: var(--green);
    color: #fff;
    border-color: var(--green);
  }
  .btn-active-gold {
    background: var(--gold);
    color: #fff;
    border-color: var(--gold);
  }

  .sync-pill {
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .sync-pill.ok { background: var(--green-soft); color: var(--green-text); border-color: transparent; }
  .sync-pill.syncing { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
  .sync-pill.warn { background: var(--gold-soft); color: var(--gold-text); border-color: transparent; }
  .sync-pill.err { background: var(--red-soft); color: var(--red-text); border-color: transparent; }

  /* ==================== MAIN WORKSPACE (100vh - 54px) ==================== */
  .workspace {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
    position: relative;
  }

  /* LEFT SIDEBAR (Master Navigation) */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
    z-index: 40;
    transition: transform 0.22s ease;
  }
  .sidebar.hidden-mode { display: none; }
  .sidebar-top {
    padding: 10px 10px 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .search-box {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 12.5px;
    font-family: inherit;
    outline: none;
  }
  .search-box:focus { border-color: var(--primary); background: var(--surface); }
  .sidebar-filters {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }
  .mini-chip {
    flex: 1;
    justify-content: center;
    font-size: 11.5px;
    padding: 4px 7px;
  }
  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
  }
  .sess-group-title {
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
    padding: 10px 8px 4px;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 2;
  }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 7px 9px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text-2);
    margin-bottom: 2px;
    border: 1px solid transparent;
    transition: all 0.12s;
  }
  .nav-item:hover { background: var(--surface-hover); color: var(--text); }
  .nav-item.active {
    background: var(--primary-soft);
    color: var(--primary);
    border-color: var(--primary-border);
    font-weight: 600;
  }
  .nav-item-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .nav-item-badges {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    flex-shrink: 0;
  }

  /* RIGHT MAIN STAGE */
  .stage {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .stage-toolbar {
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    padding: 7px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 12.5px;
  }
  .stage-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 14px 18px 24px;
  }
  .stage-inner {
    max-width: 960px;
    margin: 0 auto;
  }

  /* FOCUS MODE (1 QUESTION PER 14-INCH SCREEN) */
  .focus-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 22px;
    box-shadow: var(--shadow-sm);
  }
  .focus-card.is-bookmarked {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.16);
  }
  .focus-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding-bottom: 10px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .focus-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .focus-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--primary);
  }
  .session-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--surface-2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .focus-prompt {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 15.5px;
    line-height: 1.75;
    margin-bottom: 12px;
  }
  .focus-prompt p { margin: 4px 0; }
  .focus-footer {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .kbd-hints {
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  kbd {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 11px;
    font-family: inherit;
    font-weight: 600;
  }

  /* MARKDOWN CONTENT STYLING */
  blockquote {
    border-left: 4px solid var(--primary);
    background: var(--primary-soft);
    padding: 10px 14px;
    margin: 8px 0;
    border-radius: 0 10px 10px 0;
    font-size: 14px;
  }
  blockquote p { margin: 4px 0; }
  ul, ol { margin: 6px 0; padding-left: 20px; font-size: 14px; }
  li { margin: 3px 0; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 8px 0;
    font-size: 13.5px;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 7px 10px;
    text-align: left;
    vertical-align: top;
  }
  th { background: var(--surface-2); font-weight: 700; font-size: 12.5px; }
  tr.is-bookmarked { background: var(--gold-soft); }
  .bm-cell { width: 42px; text-align: center; }

  code {
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 5px;
    font-family: "Noto Sans JP", Consolas, monospace;
    font-size: 0.92em;
  }
  code.jp-pill {
    cursor: pointer;
    transition: all 0.12s;
  }
  code.jp-pill:hover { border-color: var(--gold); background: var(--gold-soft); }
  code.jp-pill .pill-star { margin-left: 3px; font-size: 11px; color: var(--muted); }
  code.jp-pill.bookmarked {
    background: var(--gold-soft);
    border-color: var(--gold);
    color: var(--gold-text);
    font-weight: 700;
  }
  code.jp-pill.bookmarked .pill-star { color: var(--gold); }

  .bm-btn {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
  }
  .bm-btn.bookmarked {
    background: var(--gold-soft);
    border-color: var(--gold);
    color: var(--gold-text);
  }
  .tts-btn {
    font-size: 12px;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    cursor: pointer;
    font-weight: 600;
  }
  .tts-btn:hover { border-color: var(--primary); color: var(--primary); }

  .toggle-ans-btn { display: none; margin: 6px 0; }
  body.quiz-mode .toggle-ans-btn { display: inline-flex; }
  body.quiz-mode .q-answer { display: none; }
  body.quiz-mode .q-answer.revealed { display: block; }

  /* LIST VIEW CARDS */
  .list-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 15px 18px;
    margin-bottom: 12px;
  }
  .list-card.is-bookmarked { border-color: var(--gold); }
  .session-heading {
    font-size: 17px;
    font-weight: 800;
    color: var(--primary);
    margin: 20px 0 10px;
    padding-bottom: 5px;
    border-bottom: 2px solid var(--primary-border);
  }

  /* ==================== EXAM MODE (2-COLUMN 14-INCH FIT) ==================== */
  .exam-shell {
    max-width: 1120px;
    margin: 0 auto;
    height: 100%;
  }
  .exam-setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 24px;
    box-shadow: var(--shadow-sm);
    max-width: 880px;
    margin: 8px auto;
  }
  .exam-grid-setup {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 12px;
    margin: 16px 0;
  }
  .exam-field {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
  }
  .exam-field label {
    display: block;
    font-size: 11px;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 8px;
  }
  .pill-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .choice-pill {
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .choice-pill.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }
  .custom-count-input {
    width: 76px;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 12.5px;
  }

  .exam-2col {
    display: grid;
    grid-template-columns: 1fr 250px;
    gap: 14px;
    align-items: start;
  }
  .exam-main-card, .exam-side-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
  }
  .exam-side-card { position: sticky; top: 0; }
  .exam-progress-track {
    width: 100%;
    height: 6px;
    background: var(--surface-2);
    border-radius: 99px;
    overflow: hidden;
    margin: 8px 0 12px;
  }
  .exam-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #7c3aed, #4f46e5);
    transition: width 0.2s;
  }
  .exam-options-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
    margin: 12px 0;
  }
  .exam-options-grid.single-col { grid-template-columns: 1fr; }
  .exam-opt-btn {
    width: 100%;
    text-align: left;
    justify-content: flex-start;
    padding: 10px 13px;
    font-size: 14.5px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    line-height: 1.45;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: inherit;
    transition: all 0.12s;
  }
  .exam-opt-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
  .exam-opt-btn.selected { border-color: #7c3aed; background: var(--primary-soft); font-weight: 700; }
  .exam-opt-btn.correct { border-color: var(--green); background: var(--green-soft); color: var(--green-text); font-weight: 700; }
  .exam-opt-btn.wrong { border-color: var(--red); background: var(--red-soft); color: var(--red-text); }
  .exam-opt-num {
    min-width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--surface-2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
  }
  .exam-opt-btn.selected .exam-opt-num { background: #7c3aed; color: #fff; }
  .exam-opt-btn.correct .exam-opt-num { background: var(--green); color: #fff; }
  .exam-opt-btn.wrong .exam-opt-num { background: var(--red); color: #fff; }

  .exam-dots-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    margin: 10px 0 14px;
  }
  .exam-dot {
    height: 30px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-2);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .exam-dot.current { border: 2px solid #7c3aed; color: #7c3aed; }
  .exam-dot.answered { background: var(--primary-soft); border-color: var(--primary-border); color: var(--primary); }
  .exam-dot.dot-correct { background: var(--green); border-color: var(--green); color: #fff; }
  .exam-dot.dot-wrong { background: var(--red); border-color: var(--red); color: #fff; }

  .exam-score-box {
    text-align: center;
    padding: 18px;
    background: var(--primary-soft);
    border-radius: 14px;
    margin-bottom: 16px;
  }
  .exam-score-big { font-size: 38px; font-weight: 800; color: var(--primary); }
  .review-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 15px;
    margin-bottom: 10px;
  }
  .review-item.is-wrong { border-left: 4px solid var(--red); }
  .review-item.is-right { border-left: 4px solid var(--green); }

  /* ==================== FLASHCARD MODE ==================== */
  .fc-wrap {
    max-width: 680px;
    margin: 6px auto;
    text-align: center;
  }
  .fc-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 34px 26px;
    min-height: 270px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: var(--shadow-md);
    transition: transform 0.15s, border-color 0.15s;
    margin: 14px 0;
  }
  .fc-card:hover { border-color: var(--primary); }
  .fc-front-word { font-size: 30px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
  .fc-sub { font-size: 16px; color: var(--primary); font-weight: 600; margin-bottom: 8px; }

<script>
// ==================== CONFIGURATION ====================

    nguphap: { name: "02_NGU_PHAP_N1_GMN.md", fallbackId: "1rgAp3b6pfnQ81fmHesR2pvhGxLYuVha5" },
    dochieu: { name: "03_DOC_HIEU_N1_GMN.md", fallbackId: "1u2xccVEuH2nWIrvc5_Eiv3HvCJVpXwgy" }

const KEYS = {
  CONFIG: "jlpt_n1_config_v1",
  BOOKMARKS: "jlpt_n1_bookmarks_v2",
  LEGACY_BM: "jlpt_n1_bookmarks_v1",
  MD_CACHE: "jlpt_n1_md_cache_v1",
  LAST_SYNC: "jlpt_n1_last_sync_v1",
  WRONG_IDS: "jlpt_n1_wrong_ids_v1",
  THEME: "jlpt_n1_theme_v1",
  VIEW_MODE: "jlpt_n1_view_mode_v1"
};

let appConfig = loadConfig();
let accessToken = null;
let tokenClient = null;
let bookmarkDriveFileId = null;
let pushTimer = null;

let bmState = { items: {}, deleted: {} };
let wrongIds = loadWrongIds();
let mdStore = { tuvung: "", nguphap: "", dochieu: "" };

// Parsed study items per tab for Master-Detail Focus View & List View
let tabItems = { tuvung: [], nguphap: [], dochieu: [] };
let activeItemIdx = { tuvung: 0, nguphap: 0, dochieu: 0 };
let parsedQuizBank = [];
let cheatWordsBank = [];

let currentTab = "tuvung";
let studyViewMode = localStorage.getItem(KEYS.VIEW_MODE) || "focus"; // "focus" | "list"
let onlyBookmarked = false;
let quizHideMode = false;

// Exam state
let examConfig = { source: "all", count: 10, mode: "instant" };
let examSession = null;
let examTimerInterval = null;

// Flashcard state
let fcConfig = { source: "bookmarks" }; // "bookmarks" | "cheatsheet"
let fcDeck = [];
let fcIdx = 0;
let fcFlipped = false;

const JP_RE = /[\u3040-\u30ff\u4e00-\u9fff]/;

// ==================== UTILITIES ====================
function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function showToast(msg, ms = 2600) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), ms);
}

function setSyncStatus(dot, label, cls = "") {
  const pill = document.getElementById("syncPill");
  document.getElementById("syncDot").textContent = dot;
  document.getElementById("syncLabel").textContent = label;
  pill.className = "sync-pill" + (cls ? " " + cls : "");
}

function loadConfig() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEYS.CONFIG) || "{}");
    return {
      clientId: saved.clientId || DEFAULT_CONFIG.clientId,
      apiKey: saved.apiKey || DEFAULT_CONFIG.apiKey,
      folderId: saved.folderId || DEFAULT_CONFIG.folderId,
      bookmarkFileName: saved.bookmarkFileName || DEFAULT_CONFIG.bookmarkFileName
    };
  } catch {
    return { ...DEFAULT_CONFIG };
  }
}

function loadWrongIds() {
  try { return new Set(JSON.parse(localStorage.getItem(KEYS.WRONG_IDS) || "[]")); }
  catch { return new Set(); }
}

function saveWrongIds() {
  localStorage.setItem(KEYS.WRONG_IDS, JSON.stringify([...wrongIds]));
}

function speakJapanese(text) {
  if (!("speechSynthesis" in window)) {
    showToast("Trình duyệt không hỗ trợ đọc tiếng Nhật (TTS).");
    return;
  }
  const clean = String(text || "").replace(/（[^）]*）|\([^)]*\)|[★☆①②③④＿＿＿\s]+/g, " ").trim();
  if (!clean) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = "ja-JP";
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

// ==================== THEME ====================
function initTheme() {
  const saved = localStorage.getItem(KEYS.THEME) || "light";
  document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("themeBtn").textContent = saved === "dark" ? "☀️" : "🌙";
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(KEYS.THEME, next);
  document.getElementById("themeBtn").textContent = next === "dark" ? "☀️" : "🌙";
}

// ==================== MARKDOWN PARSER (MẪU 2) ====================
function renderMdFragment(mdText) {
  if (!mdText) return "";
  if (window.marked) {
    marked.setOptions({ gfm: true, breaks: false });
    return marked.parse(mdText);
  }
  return "<pre>" + escapeHtml(mdText) + "</pre>";
}

function parseMarkdownToSections(mdText) {
  const lines = mdText.replace(/\r\n/g, "\n").split("\n");
  const sessions = [];
  let curSession = null;
  let curBlockLines = [];
  let curBlockTitle = null;
  let curBlockType = "intro";

  function flushBlock() {
    if (!curSession) return;
    const bodyMd = curBlockLines.join("\n").trim();
    if (!bodyMd && !curBlockTitle) { curBlockLines = []; return; }
    curSession.blocks.push({ type: curBlockType, title: curBlockTitle || "", body_md: bodyMd });
    curBlockLines = [];
    curBlockTitle = null;
    curBlockType = "section";
  }

  for (const line of lines) {
    if (line.startsWith("# ")) {
      flushBlock();
      curSession = { title: line.slice(2).trim(), blocks: [] };
      sessions.push(curSession);
      curBlockType = "intro"; curBlockTitle = null; curBlockLines = [];
    } else if (!curSession) {
      curSession = { title: "Tổng quan", blocks: [] };
      sessions.push(curSession);
      curBlockLines.push(line);
    } else if (line.startsWith("### ")) {
      flushBlock();
      curBlockTitle = line.slice(4).trim();
      curBlockType = "question";
      curBlockLines = [];
    } else if (line.startsWith("## ")) {
      flushBlock();
      const h2Title = line.slice(3).trim();
      curBlockTitle = h2Title;
      const u = h2Title.toUpperCase();
      curBlockType = (u.includes("CHEAT SHEET") || u.includes("BẢNG TỔNG KẾT")) ? "cheatsheet" : "section";
      curBlockLines = [];
    } else {
      curBlockLines.push(line);
    }
  }
  flushBlock();
  return sessions;
}

function enhanceCheatsheetTable(htmlStr, sessionTitle, tabId, collectWords = false) {
  const tmp = document.createElement("div");
  tmp.innerHTML = htmlStr;
  tmp.querySelectorAll("table").forEach(table => {
    const theadRow = table.querySelector("thead tr");
    if (theadRow) {
      const th = document.createElement("th");
      th.textContent = "★";
      theadRow.insertBefore(th, theadRow.firstChild);
    }
    table.querySelectorAll("tbody tr").forEach(tr => {
      const cells = tr.querySelectorAll("td");
      if (!cells.length) return;
      const wordText = (cells[0]?.textContent || "").trim();
      const readingText = (cells[1]?.textContent || "").trim();
      const meaningText = (cells[2]?.textContent || "").trim();
      const itemId = `word::${tabId}::${wordText}::${readingText}`;
      tr.dataset.bmRow = itemId;

      if (collectWords && wordText && JP_RE.test(wordText)) {
        cheatWordsBank.push({ id: itemId, title: wordText, sub: readingText, note: meaningText, session: sessionTitle });
      }

      const td = document.createElement("td");
      td.className = "bm-cell";
      const btn = document.createElement("button");
      btn.className = "bm-btn";
      btn.dataset.bmId = itemId;
      btn.dataset.bmKind = "word";
      btn.dataset.bmTitle = wordText;
      btn.dataset.bmSub = readingText;
      btn.dataset.bmNote = meaningText;
      btn.dataset.bmSession = sessionTitle;
      btn.textContent = "☆";
      td.appendChild(btn);
      tr.insertBefore(td, tr.firstChild);
    });
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
  });
  return tmp.innerHTML;
}

function makeCodePillsClickable(htmlStr, sessionTitle) {
  const tmp = document.createElement("div");
  tmp.innerHTML = htmlStr;
  tmp.querySelectorAll("code").forEach(codeEl => {
    if (codeEl.closest("pre")) return;
    const plain = (codeEl.textContent || "").trim();
    if (!plain || !JP_RE.test(plain) || plain.length > 60) return;
    if (/^[1-4１-４][.．]/.test(plain)) return;
    const itemId = `term::${plain}`;
    codeEl.classList.add("jp-pill");
    codeEl.dataset.bmId = itemId;
    codeEl.dataset.bmKind = "term";
    codeEl.dataset.bmTitle = plain;
    codeEl.dataset.bmSub = "";
    codeEl.dataset.bmNote = `Từ mở rộng (${sessionTitle})`;
    codeEl.dataset.bmSession = sessionTitle;
    codeEl.title = "Click để Bookmark từ này";
    const star = document.createElement("span");
    star.className = "pill-star";
    star.textContent = "☆";
    codeEl.appendChild(star);
  });
  return tmp.innerHTML;
}

function buildTabItems(tabId, mdText) {
  if (!mdText || !mdText.trim()) return [];
  const sessions = parseMarkdownToSections(mdText);
  const items = [];

  sessions.forEach((sess, sIdx) => {
    const sTitle = sess.title;
    sess.blocks.forEach((blk, bIdx) => {
      const bMd = blk.body_md;
      const bTitle = blk.title || (blk.type === "intro" ? "Giới thiệu buổi học" : `Mục ${bIdx + 1}`);
      if (blk.type === "intro" && !bMd.replace(/[-*_]/g, "").trim()) return;

      if (blk.type === "question") {
        const sepRe = /\n?\*\(Khoảng trống tự nhẩm đáp án\)\*\n?/;
        const parts = bMd.split(sepRe);
        let promptHtml = "", answerHtml = "", promptPlain = "";
        if (parts.length >= 2) {
          promptHtml = renderMdFragment(parts[0]);
          answerHtml = makeCodePillsClickable(renderMdFragment(parts.slice(1).join("\n")), sTitle);
          promptPlain = parts[0].replace(/[`*#>]/g, "").trim();
        } else {
          answerHtml = makeCodePillsClickable(renderMdFragment(bMd), sTitle);
          promptPlain = bMd.split("\n")[0].replace(/[`*#>]/g, "").trim();
        }
        const qId = `q::${tabId}::${sIdx}::${blk.title}`;
        const jpSentence = (promptPlain.split("\n").find(l => JP_RE.test(l)) || "").trim();
        items.push({
          id: qId,
          type: "question",
          sessionTitle: sTitle,
          title: blk.title,
          shortLabel: blk.title.replace(/`\[[^\]]+\]`/g, "").trim(),
          preview: promptPlain.slice(0, 90),
          jpText: jpSentence,
          promptHtml,
          answerHtml,
          searchText: (sTitle + " " + blk.title + " " + bMd).toLowerCase()
        });
      } else if (blk.type === "cheatsheet") {
        let html = enhanceCheatsheetTable(renderMdFragment(bMd), sTitle, tabId, true);
        html = makeCodePillsClickable(html, sTitle);
        items.push({
          id: `cs::${tabId}::${sIdx}::${bIdx}`,
          type: "cheatsheet",
          sessionTitle: sTitle,
          title: bTitle,
          shortLabel: "📋 " + bTitle,
          preview: "",
          jpText: "",
          promptHtml: "",
          answerHtml: html,
          searchText: (sTitle + " " + bTitle + " " + bMd).toLowerCase()
        });
      } else {
        const html = makeCodePillsClickable(renderMdFragment(bMd), sTitle);
        items.push({
          id: `sec::${tabId}::${sIdx}::${bIdx}`,
          type: "section",
          sessionTitle: sTitle,
          title: bTitle,
          shortLabel: "📄 " + bTitle,
          preview: "",
          jpText: "",
          promptHtml: "",
          answerHtml: html,
          searchText: (sTitle + " " + bTitle + " " + bMd).toLowerCase()
        });
      }
    });
  });

  return items;
}

function extractQuizQuestions(tabId, mdText) {
  if (!mdText) return [];
  const sessions = parseMarkdownToSections(mdText);
  const questions = [];
  sessions.forEach((sess, sIdx) => {
    sess.blocks.forEach(blk => {
      if (blk.type !== "question") return;
      const parts = blk.body_md.split(/\n?\*\(Khoảng trống tự nhẩm đáp án\)\*\n?/);
      if (parts.length < 2) return;
      const promptMd = parts[0].trim();
      const answerMd = parts.slice(1).join("\n").trim();
      const ansMatch = answerMd.match(/Đáp án(?:\s*\(★\))?:\**\s*`?([1-4])/);
      if (!ansMatch) return;
      const correctNum = parseInt(ansMatch[1], 10);

      let options = [];
      let cleanPromptMd = promptMd;
      const btMatches = [...promptMd.matchAll(/`([1-4])\.\s*([^`]+)`/g)];
      if (btMatches.length >= 4) {
        const byNum = {};
        btMatches.forEach(m => { byNum[m[1]] = m[2].trim(); });
        if (byNum["1"] && byNum["2"] && byNum["3"] && byNum["4"]) {
          options = [byNum["1"], byNum["2"], byNum["3"], byNum["4"]];
          cleanPromptMd = promptMd.split("\n").filter(l => !/`[1-4]\./.test(l)).join("\n").trim();
        }
      }
      if (options.length !== 4) {
        const byNum = {}, kept = [];
        promptMd.split("\n").forEach(line => {
          const m = line.match(/^\s*([1-4])\.\s+(.+)$/);
          if (m && !byNum[m[1]]) byNum[m[1]] = m[2].trim();
          else kept.push(line);
        });
        if (byNum["1"] && byNum["2"] && byNum["3"] && byNum["4"]) {
          options = [byNum["1"], byNum["2"], byNum["3"], byNum["4"]];
          cleanPromptMd = kept.join("\n").trim();
        }
      }
      if (options.length !== 4) return;
      const qId = `q::${tabId}::${sIdx}::${blk.title}`;
      const firstLine = (cleanPromptMd.split("\n")[0] || "").replace(/[`*#>]/g, "").trim();
      const longOpts = options.some(o => o.length > 22);

      questions.push({
        id: qId,
        tabId,
        categoryLabel: tabId === "tuvung" ? "📘 Từ vựng" : "📗 Ngữ pháp",
        sessionTitle: sess.title,
        title: blk.title,
        promptHtml: renderMdFragment(cleanPromptMd),
        promptPlain: firstLine,
        options,
        longOpts,
        correct: correctNum,
        explanationHtml: renderMdFragment(answerMd)
      });
    });
  });
  return questions;
}

function rebuildAllContent() {
  cheatWordsBank = [];
  tabItems.tuvung = buildTabItems("tuvung", mdStore.tuvung);
  tabItems.nguphap = buildTabItems("nguphap", mdStore.nguphap);

function getFilteredItems(tabId) {
  const q = (document.getElementById("searchInput")?.value || "").trim().toLowerCase();
  return (tabItems[tabId] || []).filter(item => {
    const matchQ = !q || item.searchText.includes(q);
    const matchBm = !onlyBookmarked || isItemBookmarked(item);
    return matchQ && matchBm;
  });
}

function isItemBookmarked(item) {
  if (bmState.items[item.id]) return true;
  if (item.type === "cheatsheet") {
    return Object.keys(bmState.items).some(k => k.startsWith("word::") && item.answerHtml.includes(escapeHtml(k)));
  }
  return false;
}

function switchFlashcardSource(src) {
  fcConfig.source = src;
  buildFlashcardDeck();
  renderFlashcardView();
}
function flipFlashcard() { fcFlipped = !fcFlipped; renderFlashcardView(); }
function stepFlashcard(d) {
  const n = fcIdx + d;
  if (n >= 0 && n < fcDeck.length) { fcIdx = n; fcFlipped = false; renderFlashcardView(); }
}
function shuffleFlashcards() {
  fcDeck = shuffleArray(fcDeck);
  fcIdx = 0; fcFlipped = false;
  renderFlashcardView();
  showToast("🔀 Đã xáo trộn bộ thẻ!");
}

function getFilteredExamPool(source) {
  if (source === "tuvung") return parsedQuizBank.filter(q => q.tabId === "tuvung");
  if (source === "nguphap") return parsedQuizBank.filter(q => q.tabId === "nguphap");
  if (source === "bookmarked") return parsedQuizBank.filter(q => !!bmState.items[q.id]);
  if (source === "wrong") return parsedQuizBank.filter(q => wrongIds.has(q.id));
  return [...parsedQuizBank];
}

            <button class="choice-pill ${examConfig.mode==='submit'?'active':''}" onclick="setExamConfig('mode','submit')">🎯 Nộp bài mới chấm</button>

function setExamConfig(k, v) { examConfig[k] = v; renderExamView(); }
function setCustomExamCount(v) { const n = parseInt(v, 10); if (n > 0) { examConfig.count = n; renderExamView(); } }
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function formatDuration(sec) {
  return `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
}

function startExam(customList = null) {
  const pool = customList || getFilteredExamPool(examConfig.source);
  if (!pool.length) { showToast("Không có câu hỏi nào!"); return; }
  const desired = customList ? pool.length : (examConfig.count === "all" ? pool.length : Math.min(Number(examConfig.count) || 10, pool.length));
  examSession = {
    questions: shuffleArray(pool).slice(0, desired),
    answers: {},
    currentIdx: 0,
    mode: examConfig.mode,
    startedAt: Date.now(),
    elapsedSec: 0,
    finished: false
  };
  clearInterval(examTimerInterval);
  examTimerInterval = setInterval(() => {
    if (!examSession || examSession.finished) return;
    examSession.elapsedSec = Math.floor((Date.now() - examSession.startedAt) / 1000);
    const el = document.getElementById("examTimer");
    if (el) el.textContent = formatDuration(examSession.elapsedSec);
  }, 1000);
  renderExamView();
}

function selectExamOption(num) {
  if (!examSession || examSession.finished) return;
  const q = examSession.questions[examSession.currentIdx];
  examSession.answers[examSession.currentIdx] = num;
  if (num === q.correct) wrongIds.delete(q.id);
  else wrongIds.add(q.id);
  saveWrongIds();
  renderExamView();
}

function moveExamQuestion(d) {
  if (!examSession) return;
  const n = examSession.currentIdx + d;
  if (n >= 0 && n < examSession.questions.length) { examSession.currentIdx = n; renderExamView(); }
}
function goToExamQuestion(i) { if (examSession) { examSession.currentIdx = i; renderExamView(); } }
function toggleExamQuestionBookmark(idx) {
  const q = examSession?.questions[idx];
  if (!q) return;
  toggleBookmarkByData({ id: q.id, kind: "question", title: q.title, sub: q.promptPlain.slice(0, 90), note: "", session: q.sessionTitle });
  renderExamView();
}
function finishExam() {
  if (!examSession) return;
  examSession.questions.forEach((q, i) => {
    const a = examSession.answers[i];
    if (a === q.correct) wrongIds.delete(q.id);
    else if (a !== undefined) wrongIds.add(q.id);
  });
  saveWrongIds();
  examSession.finished = true;
  clearInterval(examTimerInterval);
  renderExamView();
}
function exitExam() { clearInterval(examTimerInterval); examSession = null; renderExamView(); }
function retryWrongExam() {
  const wrongQs = examSession.questions.filter((q, i) => examSession.answers[i] !== q.correct);
  if (!wrongQs.length) { showToast("🎉 Bạn đã đúng 100%!"); return; }
  startExam(wrongQs);
}
function bookmarkAllWrongExam() {
  const wrongQs = examSession.questions.filter((q, i) => examSession.answers[i] !== q.correct);
  if (!wrongQs.length) return;
  const now = new Date().toISOString();
  wrongQs.forEach(q => {
    delete bmState.deleted[q.id];
    bmState.items[q.id] = { id: q.id, kind: "question", title: q.title, sub: q.promptPlain.slice(0, 90), note: "Sai khi làm bài thi", session: q.sessionTitle, addedAt: now, updatedAt: now };
  });
  onBookmarksChanged();
  renderExamView();
  showToast(`★ Đã Bookmark ${wrongQs.length} câu làm sai!`);
}

function loadBookmarksLocal() {
  try {
    const raw = localStorage.getItem(KEYS.BOOKMARKS);
    if (raw) { const p = JSON.parse(raw); bmState = { items: p.items || {}, deleted: p.deleted || {} }; return; }
    const leg = localStorage.getItem(KEYS.LEGACY_BM);
    if (leg) { bmState = { items: JSON.parse(leg) || {}, deleted: {} }; saveBookmarksLocal(); }
  } catch { bmState = { items: {}, deleted: {} }; }
}
function saveBookmarksLocal() { localStorage.setItem(KEYS.BOOKMARKS, JSON.stringify(bmState)); }

function mergeBookmarkStates(local, remote) {
  const merged = { items: {}, deleted: {} };
  const allIds = new Set([
    ...Object.keys(local.items || {}), ...Object.keys(local.deleted || {}),
    ...Object.keys(remote.items || {}), ...Object.keys(remote.deleted || {})
  ]);
  allIds.forEach(id => {
    const lItem = local.items?.[id], rItem = remote.items?.[id];
    const lDel = local.deleted?.[id] || "", rDel = remote.deleted?.[id] || "";
    const lTs = lItem ? (lItem.updatedAt || lItem.addedAt || "1970-01-01") : "";
    const rTs = rItem ? (rItem.updatedAt || rItem.addedAt || "1970-01-01") : "";
    const maxItemTs = lTs >= rTs ? lTs : rTs;
    const winItem = lTs >= rTs ? lItem : rItem;
    const maxDelTs = lDel >= rDel ? lDel : rDel;
    if (maxDelTs && maxDelTs > maxItemTs) merged.deleted[id] = maxDelTs;
    else if (winItem) merged.items[id] = winItem;
  });
  return merged;
}

// ==================== DRIVE API (PUBLIC API KEY + OAUTH 2.0) ====================
function handleSyncClick() {
  if (accessToken) syncAllFromDrive();
  else connectGoogleDrive();
}

async function fetchPublicMarkdownWithApiKey() {
  if (!appConfig.apiKey) return false;
  setSyncStatus("⏳", "Đang tải .md...", "syncing");
  try {
    const key = encodeURIComponent(appConfig.apiKey);
    const q = encodeURIComponent(`'${appConfig.folderId}' in parents and trashed = false`);
    const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&orderBy=modifiedTime%20desc&key=${key}`);
    if (!listRes.ok) throw new Error("Public API Key fetch failed");
    const data = await listRes.json();
    const byName = {};
    (data.files || []).forEach(f => { if (!byName[f.name]) byName[f.name] = f; });

    await Promise.all(Object.entries(DEFAULT_CONFIG.files).map(async ([tabId, meta]) => {
      const fid = byName[meta.name]?.id || meta.fallbackId;
      const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fid}?alt=media&key=${key}`);
      if (r.ok) mdStore[tabId] = await r.text();
    }));

    localStorage.setItem(KEYS.MD_CACHE, JSON.stringify(mdStore));
    localStorage.setItem(KEYS.LAST_SYNC, new Date().toISOString());
    rebuildAllContent();
    setSyncStatus("🌐", "Đã tải .md (Public)", "ok");
    return true;
  } catch (e) {
    console.warn("Public API Key load error:", e);
    return false;
  }
}

function connectGoogleDrive() {
  if (!appConfig.clientId) { openSettings(); return; }
  if (!window.google?.accounts?.oauth2) { showToast("⏳ Đang tải Google Auth, thử lại sau 2 giây..."); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: appConfig.clientId,
    scope: "https://www.googleapis.com/auth/drive",
    callback: async (resp) => {
      if (resp.error) { setSyncStatus("🔴", "Lỗi OAuth", "err"); showToast("Lỗi OAuth: " + resp.error); return; }
      accessToken = resp.access_token;
      await syncAllFromDrive();
    }
  });
  tokenClient.requestAccessToken({ prompt: "" });
}

async function driveFetch(url, options = {}) {
  if (!accessToken) throw new Error("Chưa đăng nhập Google Drive");
  const headers = Object.assign({}, options.headers || {}, { Authorization: "Bearer " + accessToken });
  const res = await fetch(url, Object.assign({}, options, { headers }));
  if (res.status === 401) { accessToken = null; setSyncStatus("🔑", "Đăng nhập lại", "warn"); throw new Error("Hết phiên đăng nhập"); }
  if (!res.ok) throw new Error(`Drive API ${res.status}`);
  return res;
}

async function syncAllFromDrive() {
  if (!accessToken) { connectGoogleDrive(); return; }
  setSyncStatus("⏳", "Đang đồng bộ...", "syncing");
  try {
    const q = encodeURIComponent(`'${appConfig.folderId}' in parents and trashed = false`);
    const listRes = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&orderBy=modifiedTime%20desc&pageSize=100`);
    const files = (await listRes.json()).files || [];
    const byName = {};
    files.forEach(f => { if (!byName[f.name]) byName[f.name] = f; });

    await Promise.all(Object.entries(DEFAULT_CONFIG.files).map(async ([tabId, meta]) => {
      const fid = byName[meta.name]?.id || meta.fallbackId;
      if (fid) {
        const r = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fid}?alt=media`);
        mdStore[tabId] = await r.text();
      }
    }));

    localStorage.setItem(KEYS.MD_CACHE, JSON.stringify(mdStore));
    localStorage.setItem(KEYS.LAST_SYNC, new Date().toISOString());
    bookmarkDriveFileId = byName[appConfig.bookmarkFileName]?.id || null;

    await syncBookmarksWithDrive(false);
    rebuildAllContent();

    const t = new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
    setSyncStatus("🟢", `Đã đồng bộ (${t})`, "ok");
    showToast(`✅ Đã đồng bộ 3 file .md (${parsedQuizBank.length} câu thi) & Bookmark!`);
  } catch (err) {
    setSyncStatus("🔴", "Lỗi đồng bộ", "err");
    showToast("Lỗi đồng bộ: " + err.message, 3600);
  }
}

async function syncBookmarksWithDrive(manual = false) {
  if (!accessToken) {
    if (manual) { connectGoogleDrive(); }
    return;
  }
  try {
    document.getElementById("bmSyncInfo").textContent = "⏳ Đang đồng bộ...";
    if (!bookmarkDriveFileId) {
      const q = encodeURIComponent(`'${appConfig.folderId}' in parents and name = '${appConfig.bookmarkFileName}' and trashed = false`);
      const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);
      const d = await res.json();
      if (d.files?.length) bookmarkDriveFileId = d.files[0].id;
    }
    if (bookmarkDriveFileId) {
      const r = await driveFetch(`https://www.googleapis.com/drive/v3/files/${bookmarkDriveFileId}?alt=media`);
      try {
        const parsed = JSON.parse(await r.text());
        bmState = mergeBookmarkStates(bmState, parsed.items ? parsed : { items: parsed, deleted: {} });
        saveBookmarksLocal();
        syncBookmarkBadgesOnly();
      } catch {}
    }
    const payload = JSON.stringify({ version: 2, updatedAt: new Date().toISOString(), items: bmState.items, deleted: bmState.deleted }, null, 2);
    if (bookmarkDriveFileId) {
      await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${bookmarkDriveFileId}?uploadType=media`, {
        method: "PATCH", headers: { "Content-Type": "application/json; charset=UTF-8" }, body: payload
      });
    } else {
      const b = "jlpt_bm_" + Date.now();
      const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: appConfig.bookmarkFileName, parents: [appConfig.folderId], mimeType: "application/json" })}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${payload}\r\n--${b}--`;
      const res = await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
        method: "POST", headers: { "Content-Type": `multipart/related; boundary=${b}` }, body
      });
      bookmarkDriveFileId = (await res.json()).id;
    }
    const t = new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("bmSyncInfo").textContent = `☁️ Đã đồng bộ (${t})`;
    if (manual) showToast("☁️ Đã đồng bộ Bookmark lên Drive!");
  } catch (err) {
    document.getElementById("bmSyncInfo").textContent = "⚠️ Lỗi đồng bộ (đã lưu máy)";
    if (manual) showToast("Lỗi: " + err.message);
  }
}

function loadLocalMarkdownFiles(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      const n = file.name.toUpperCase();
      if (n.includes("01") || n.includes("TU_VUNG")) mdStore.tuvung = reader.result;
      else if (n.includes("02") || n.includes("NGU_PHAP")) mdStore.nguphap = reader.result;
      else if (n.includes("03") || n.includes("DOC_HIEU")) mdStore.dochieu = reader.result;
      else mdStore.tuvung = reader.result;
      if (++loaded === files.length) {
        localStorage.setItem(KEYS.MD_CACHE, JSON.stringify(mdStore));
        rebuildAllContent();
        closeSettings();
        setSyncStatus("📂", "File nội bộ", "warn");
        showToast(`✅ Đã nạp ${loaded} file .md (${parsedQuizBank.length} câu thi)!`);
      }
    };
    reader.readAsText(file, "utf-8");
  });
}

// ==================== UI ACTIONS & KEYBOARD SHORTCUTS ====================
function switchTab(tabId) {
  currentTab = tabId;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tabId));
  if (tabId === "flashcard") buildFlashcardDeck();
  renderCurrentView();
}

function onSearchOrFilterChange() {
  activeItemIdx[currentTab] = 0;
  renderCurrentView();
}

function toggleQuizMode() {
  quizHideMode = !quizHideMode;
  document.body.classList.toggle("quiz-mode", quizHideMode);
  document.getElementById("quizBtn").classList.toggle("btn-active-green", quizHideMode);
}

function toggleOneAns(btn) {
  const ans = btn.nextElementSibling;
  if (ans) ans.classList.toggle("revealed");
}

function toggleFilterBookmarked() {
  onlyBookmarked = !onlyBookmarked;
  document.getElementById("filterBmBtn").classList.toggle("btn-active-gold", onlyBookmarked);
  onSearchOrFilterChange();
}

function toggleMobileSidebar() {
  document.getElementById("sidebar").classList.toggle("mobile-open");
  document.getElementById("sidebarBackdrop").classList.toggle("open");
}
function closeMobileSidebar() {
  document.getElementById("sidebar").classList.remove("mobile-open");
  document.getElementById("sidebarBackdrop").classList.remove("open");
}
function openDrawer() { document.getElementById("drawer").classList.add("open"); document.getElementById("drawerBackdrop").classList.add("open"); }
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); document.getElementById("drawerBackdrop").classList.remove("open"); }

function openSettings() {
  document.getElementById("cfgClientId").value = appConfig.clientId;
  document.getElementById("cfgApiKey").value = appConfig.apiKey || "";
  document.getElementById("cfgFolderId").value = appConfig.folderId;
  document.getElementById("cfgBmFile").value = appConfig.bookmarkFileName;
  document.getElementById("currentOriginDisplay").textContent = window.location.origin;
  document.getElementById("settingsModal").classList.add("open");
  document.getElementById("settingsBackdrop").classList.add("open");
}
function closeSettings() { document.getElementById("settingsModal").classList.remove("open"); document.getElementById("settingsBackdrop").classList.remove("open"); }
function saveSettings() {
  appConfig.clientId = document.getElementById("cfgClientId").value.trim();
  appConfig.apiKey = document.getElementById("cfgApiKey").value.trim();
  appConfig.folderId = document.getElementById("cfgFolderId").value.trim() || DEFAULT_CONFIG.folderId;
  appConfig.bookmarkFileName = document.getElementById("cfgBmFile").value.trim() || "jlpt_bookmarks.json";
  localStorage.setItem(KEYS.CONFIG, JSON.stringify(appConfig));
  closeSettings();
  showToast("✅ Đã lưu cài đặt!");
  if (appConfig.apiKey && !accessToken) fetchPublicMarkdownWithApiKey();
}
function clearLocalCache() {
  localStorage.removeItem(KEYS.MD_CACHE);
  mdStore = { tuvung: "", nguphap: "", dochieu: "" };
  rebuildAllContent();
  closeSettings();
  showToast("🗑️ Đã xóa cache .md");
}

function exportMarkdown() {
  const items = Object.values(bmState.items);
  if (!items.length) { showToast("Chưa có bookmark nào!"); return; }
  let md = "# DANH SÁCH BOOKMARK JLPT N1\n\n| Mục | Ghi chú / Nghĩa | Nguồn |\n| :--- | :--- | :--- |\n";
  items.forEach(it => {
    const note = [it.sub, it.note].filter(Boolean).join(" — ").replace(/\|/g, "/");
    md += `| **${it.title.replace(/\|/g, "/")}** | ${note} | ${it.session.replace(/\|/g, "/")} |\n`;
  });
  downloadFile("JLPT_N1_BOOKMARKS.md", md, "text/markdown;charset=utf-8");
}
function exportJson() {
  downloadFile("jlpt_bookmarks.json", JSON.stringify({ version: 2, items: bmState.items, deleted: bmState.deleted }, null, 2), "application/json");
}
function importJson(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const p = JSON.parse(r.result);
      bmState = mergeBookmarkStates(bmState, p.items ? p : { items: p, deleted: {} });
      onBookmarksChanged();
      showToast("✅ Đã khôi phục Bookmark!");
    } catch { showToast("❌ File JSON không hợp lệ."); }
  };
  r.readAsText(f);
}
function downloadFile(name, content, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name; a.click();
}

// Global click for [data-bm-id]
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-bm-id]");
  if (t) {
    e.stopPropagation();
    toggleBookmarkByData({
      id: t.dataset.bmId, kind: t.dataset.bmKind, title: t.dataset.bmTitle,
      sub: t.dataset.bmSub, note: t.dataset.bmNote, session: t.dataset.bmSession
    });
  }
});

// Keyboard shortcuts for ultra-fast PC study & exam
document.addEventListener("keydown", (e) => {
  if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;

  if (currentTab === "exam" && examSession && !examSession.finished) {
    if (["1", "2", "3", "4"].includes(e.key)) {
      const s = examSession;
      if (!(s.mode === "instant" && s.answers[s.currentIdx] !== undefined)) {
        selectExamOption(parseInt(e.key, 10));
      }
    } else if (e.key === "ArrowRight") moveExamQuestion(1);
    else if (e.key === "ArrowLeft") moveExamQuestion(-1);
    return;
  }

  if (currentTab === "flashcard" && fcDeck.length) {
    if (e.key === " ") { e.preventDefault(); flipFlashcard(); }
    else if (e.key === "ArrowRight") stepFlashcard(1);
    else if (e.key === "ArrowLeft") stepFlashcard(-1);
    return;
  }

  if (["tuvung", "nguphap", "dochieu"].includes(currentTab) && studyViewMode === "focus") {
    if (e.key === "ArrowRight") stepItem(1);
    else if (e.key === "ArrowLeft") stepItem(-1);
    else if (e.key === " " && quizHideMode) {
      e.preventDefault();
      const btn = document.getElementById("focusRevealBtn");
      if (btn) toggleOneAns(btn);
    } else if (e.key.toLowerCase() === "b") {
      const list = getFilteredItems(currentTab);
      const item = list[activeItemIdx[currentTab]];
      if (item && item.type === "question") {
        toggleBookmarkByData({ id: item.id, kind: "question", title: item.title, sub: item.preview, note: "", session: item.sessionTitle });
        renderCurrentView();
      }
    }
  }
});

// ==================== BOOTSTRAP ====================
initTheme();
document.getElementById("viewModeBtn").textContent = studyViewMode === "focus" ? "🎯 1 câu" : "📜 Cuộn";
loadBookmarksLocal();

try {
  const cachedMd = JSON.parse(localStorage.getItem(KEYS.MD_CACHE) || "null");
  if (cachedMd && (cachedMd.tuvung || cachedMd.nguphap || cachedMd.dochieu)) {
    mdStore = cachedMd;
    const last = localStorage.getItem(KEYS.LAST_SYNC);
    const label = last ? new Date(last).toLocaleDateString("vi-VN") : "Cache";
    setSyncStatus("📦", `Cache (${label})`, "warn");
  }
} catch {}

rebuildAllContent();

// If a public Read-only API Key is configured, fetch latest .md automatically with ZERO login!
if (appConfig.apiKey) {
  fetchPublicMarkdownWithApiKey();
}
</script>
